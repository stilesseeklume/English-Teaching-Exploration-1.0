<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Legends · 读书模式</title>
<link rel="stylesheet" href="../shared/ui/dock.css">
<style>
  :root{
    --desk:#e8e5dd; --paper:#faf8f2; --ink:#2b2a26; --ink-2:#55524a;
    --muted:#8d8779; --rule:#ded7c7; --mark:#ffd166; --accent:#b98a28;
    /* 共享 Dock 的设计令牌 */
    --surface:var(--paper); --surface-3:#f1ece0; --border:var(--rule);
    --text:var(--ink); --text-2:var(--ink-2); --text-3:var(--muted); --accent-bg:#fff6e4;
    --margin-w:clamp(400px,31vw,560px); /* 页边宽度，可拖拽调整 */
    --sk-mw:var(--margin-w);            /* Dock 据此居中 */
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    background:var(--desk); color:var(--ink); overflow:hidden;
  }
  .bk-stage{
    position:fixed; inset:0; display:grid;
    grid-template-columns:minmax(0,1fr) var(--margin-w);
  }
  /* 书页与页边之间的拖拽条：左右拉，改讲解区宽度 */
  .bk-resize{
    position:absolute; top:0; bottom:0; right:calc(var(--margin-w) - 6px);
    width:12px; z-index:30; cursor:col-resize; touch-action:none;
  }
  .bk-resize::after{
    content:''; position:absolute; left:5px; top:50%; width:2px; height:44px;
    margin-top:-22px; background:var(--rule); border-radius:2px; opacity:.85;
    transition:background .15s, opacity .15s;
  }
  .bk-resize:hover::after,.bk-resize.dragging::after{background:var(--accent); opacity:1;}
  /* ── 书页 ── */
  .bk-view{
    position:relative; overflow:hidden; background:var(--desk);
    touch-action:none; cursor:grab;
  }
  .bk-view.dragging{cursor:grabbing;}
  .bk-canvas{
    position:absolute; left:0; top:0; width:1241px; height:1754px;
    transform-origin:0 0; will-change:transform;
  }
  .bk-canvas.ease{transition:transform .62s cubic-bezier(.22,.61,.25,1);}
  .bk-img{display:block; width:1241px; height:1754px; user-select:none; -webkit-user-drag:none;}
  .bk-hits{position:absolute; inset:0; isolation:isolate;}
  .hit{
    position:absolute; border-radius:4px; background:transparent; cursor:pointer;
    transition:background .18s ease; pointer-events:auto; z-index:3;
  }
  .hit.hot{background:rgba(255,209,102,.46); mix-blend-mode:multiply;}
  .hit.on{background:rgba(255,193,54,.62); mix-blend-mode:multiply;}
  .hit.on::after{
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:1.5px;
    background:var(--accent); opacity:.5; border-radius:2px;
  }
  /* 段名热区：书页上的标题本身就是入口 */
  .sec-hit{
    position:absolute; border-radius:6px; background:transparent; cursor:pointer;
    transition:background .2s ease; z-index:2;
  }
  .sec-hit.hot{background:rgba(255,209,102,.22); mix-blend-mode:multiply;}
  .sec-hit.on{background:rgba(255,193,54,.34); mix-blend-mode:multiply;}
  /* 篇级热区：压在蓝色横条上，用白描边而不是黄色 */
  .map-hit{
    position:absolute; border-radius:3px; background:transparent; cursor:pointer;
    transition:background .2s ease, box-shadow .2s ease; z-index:4;
  }
  .map-hit.hot{background:rgba(255,255,255,.13); box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);}
  .map-hit.on{background:rgba(255,255,255,.2); box-shadow:inset 0 0 0 2px rgba(255,255,255,.75);}
  /* ── 页边 ── */
  .bk-margin{
    position:relative; background:var(--paper);
    border-left:1px solid var(--rule);
    padding:24px 22px 20px; overflow:hidden;
  }
  .bk-margin::before{
    content:''; position:absolute; left:9px; top:0; bottom:0; width:1px;
    background:linear-gradient(to bottom,transparent,var(--rule) 12%,var(--rule) 88%,transparent);
    opacity:.55;
  }
  .bk-hint{
    position:absolute; left:24px; right:24px; top:26%; text-align:left;
    transition:opacity .35s ease; pointer-events:none;
  }
  .bk-hint b{display:block; font-size:19px; font-weight:600; color:var(--ink-2); letter-spacing:.01em;}
  .bk-hint span{display:block; margin-top:9px; font-size:16px; line-height:1.9; color:var(--muted);}
  .bk-hint.gone{opacity:0;}
  /* 批注 */
  .note{
    position:absolute; left:20px; right:20px; top:16px;
    max-height:calc(100% - 76px);
    /* 讲解区基准字号：随屏高微调，默认让卡片内容大致占到面板高度的 3/4；
       底部「字小 / 字大」通过 --ns 在此基准上增减 */
    font-size:calc(clamp(20px, 2.72vh, 31px) * var(--ns, 1));
    overflow:auto; overscroll-behavior:contain; padding:2px 0 6px;
    transition:opacity .26s ease, transform .26s cubic-bezier(.22,.61,.25,1);
    opacity:0; transform:translateY(8px); pointer-events:none;
    scrollbar-width:thin;
  }
  .note.in{opacity:1; transform:none; pointer-events:auto;}
  .n-kicker{
    display:flex; align-items:center; gap:8px;
    font-size:.75em; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
  }
  .n-kicker .n-rule{flex:1; height:1px; background:var(--rule);}
  .n-nav{display:flex; gap:2px; margin-left:2px;}
  .n-nav button{
    width:1.65em; height:1.65em; border:0; background:none; color:var(--muted);
    cursor:pointer; border-radius:.35em; font-size:1.333em; line-height:1; padding:0;
  }
  .n-nav button:hover{background:#fff; color:var(--ink);}
  .n-nav button:disabled{opacity:.22; cursor:default; background:none;}
  .n-nav button.m-close{width:auto; padding:0 5px; font-size:1em; letter-spacing:.04em;}
  .n-row{display:block; margin-top:9px; line-height:1.52;}
  .n-lab{
    display:inline; font-size:.8125em; font-weight:600; letter-spacing:.04em;
    color:var(--accent); margin-right:7px;
  }
  .n-val{display:inline; font-size:1em; line-height:1.52; color:var(--ink-2);}
  .n-val b{color:var(--ink); font-weight:600;}
  .n-words{
    display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin-top:9px;
    padding-top:7px; border-top:1px dashed var(--rule);
  }
  .n-words-cap{font-size:.78em; color:var(--muted); margin-right:2px;}
  .n-chip{
    font:inherit; font-size:.90625em; color:var(--ink); background:#fff;
    border:1px solid var(--rule); border-radius:999px; padding:5px 10px; cursor:pointer;
    transition:border-color .18s, background .18s, transform .18s;
  }
  .n-chip:hover{border-color:var(--accent); background:#fffaf0; transform:translateY(-1px);}
  .n-chip i{font-style:normal; color:var(--muted); margin-left:5px; font-size:.82em;}
  /* 复述骨架：逐句点开，讲完一段整副亮出来 */
  .n-skel{margin-top:14px; padding-top:10px; border-top:1px dashed var(--rule);}
  .n-skel-cap{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .n-skel-cap span{font-size:.78em; letter-spacing:.06em; color:var(--muted);}
  .n-skel-btn{
    flex:none; font:inherit; font-size:.8125em; color:var(--accent); background:#fff;
    border:1px solid var(--rule); border-radius:999px; padding:5px 12px; cursor:pointer;
  }
  .n-skel-btn:hover{border-color:var(--accent); background:#fffaf0;}
  .n-skel-btn:disabled{
    color:var(--muted); background:#fbfaf7; border-color:var(--rule); opacity:.75; cursor:default;
  }
  .n-skel-list{margin-top:8px; display:flex; flex-direction:column; gap:6px;}
  .n-skel-list.skel-sum{gap:11px; margin-top:4px;}
  .n-skel-list.skel-sum .s-note{font-size:1.0625em; line-height:1.7;}
  .n-skel .s-note.new{animation:skelIn .42s ease both;}
  @keyframes skelIn{from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:none;}}
  .n-skel.full{border-top-color:rgba(185,138,40,.5);}
  .n-skel.full .n-skel-cap span{color:var(--accent); font-weight:600;}
  .n-skel-done{margin:8px 0 0; font-size:.8125em; color:var(--muted);}
  /* 段卡 */
  .s-head{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;}
  .s-head b{
    font-family:Georgia,"Times New Roman",serif; font-size:1.875em; font-weight:600;
    letter-spacing:-.01em; color:var(--ink);
  }
  .s-head span{font-size:.90625em; color:var(--muted);}
  .s-role{margin-top:8px; font-size:1em; font-weight:600; letter-spacing:.04em; color:var(--accent);}
  .s-gist{margin:10px 0 0; font-size:1.28125em; line-height:1.78; color:var(--ink-2);}
  .s-sec{margin-top:24px;}
  .s-cap{
    font-size:.84375em; letter-spacing:.09em; color:var(--muted); margin-bottom:9px;
  }
  .s-q{border-top:1px dashed var(--rule); padding-top:13px; margin-top:13px;}
  .s-q:first-of-type{border-top:0; padding-top:0; margin-top:0;}
  .s-qq{
    display:flex; gap:9px; width:100%; text-align:left; font:inherit;
    font-size:1.1875em; line-height:1.7; color:var(--ink); background:none;
    border:0; padding:0; cursor:pointer;
  }
  .s-qq i{font-style:normal; font-size:.684em; color:var(--accent); padding-top:5px; flex:none;}
  .s-qq:hover span{color:var(--accent);}
  .s-qa{display:none; margin:9px 0 0 24px; font-size:1.15625em; line-height:1.75; color:var(--ink-2);}
  .s-q.open .s-qa{display:block;}
  /* 卡住了：先给一步台阶，答案再藏一层 */
  .s-hint{
    padding:10px 12px; background:#fff8e8; border-left:3px solid #e6cf99;
    border-radius:6px; font-size:1em; line-height:1.62; color:var(--ink-2);
  }
  .s-hint b{display:block; font-size:.8125em; letter-spacing:.06em; color:var(--accent); margin-bottom:5px;}
  .s-reveal{
    margin-top:10px; font:inherit; font-size:.9375em; color:var(--accent);
    background:#fff; border:1px solid var(--rule); border-radius:999px;
    padding:6px 14px; cursor:pointer;
  }
  .s-reveal:hover{border-color:var(--accent); background:#fffaf0;}
  .s-ans{display:none; margin-top:11px; padding-top:10px; border-top:1px dashed var(--rule);}
  .s-q.revealed .s-ans{display:block;}
  .s-q.revealed .s-reveal{display:none;}
  .s-ans b{display:block; font-size:.8125em; letter-spacing:.08em; color:var(--muted);}
  .s-ans span{display:block; margin-top:5px; font-size:1.0625em; line-height:1.68; color:var(--ink-2);}
  /* 这一段的手法 */
  .s-crafts{display:flex; flex-direction:column; gap:9px; margin-top:10px;}
  .s-craft{font-size:1.0625em; line-height:1.68; color:var(--ink-2);}
  .s-craft b{display:block; font-size:.9375em; color:var(--ink); margin-bottom:2px;}
  .s-fold{margin-top:20px; border-top:1px dashed var(--rule); padding-top:12px;}
  .s-fold summary{
    display:flex; align-items:center; gap:7px; cursor:pointer; list-style:none;
    font-size:1em; letter-spacing:.04em; color:var(--accent); font-weight:600;
    padding:4px 0;
  }
  .s-fold summary::-webkit-details-marker{display:none;}
  .s-fold summary::before{content:'＋'; font-size:.8125em; color:var(--muted);}
  .s-fold[open] summary::before{content:'−';}
  .s-note{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.96875em;
    line-height:1.62; color:var(--ink-2); white-space:pre-wrap;
  }
  .s-note em{
    font-style:normal; display:block; font-family:-apple-system,"PingFang SC",sans-serif;
    font-size:.871em; color:var(--muted); margin:1px 0 2px 2px;
  }
  .s-note.lv1,.s-note.lv2{border-left:1px solid rgba(185,138,40,.24);}
  .s-note-dot{display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--accent);margin-right:7px;vertical-align:middle;}
  .s-tr{margin-top:10px; font-size:1.15625em; line-height:1.82; color:var(--ink-2);}
  .s-tr p{margin:0 0 7px;}
  .s-jump{
    margin-top:22px; font:inherit; font-size:1em; color:var(--accent);
    background:#fffaf0; border:1px solid var(--rule); border-radius:999px;
    padding:8px 16px; cursor:pointer;
  }
  .s-jump:hover{border-color:var(--accent);}
  /* 篇卡：一屏看完整篇骨架，不再分五步 */
  .m-head b{
    display:block; font-family:Georgia,"Times New Roman",serif; font-size:1.75em;
    font-weight:600; letter-spacing:-.01em;
  }
  .m-head span{display:block; margin-top:3px; font-size:.875em; color:var(--muted);}
  .m-guide{margin:9px 0 0; font-size:1em; line-height:1.65; color:var(--muted);}
  .m-spine{margin-top:12px;}
  .m-node{
    display:grid; grid-template-columns:2.1em minmax(0,1fr); gap:9px;
    width:100%; text-align:left; font:inherit; background:none; border:0;
    border-top:1px dashed var(--rule); padding:12px 0; cursor:pointer;
  }
  .m-node:first-child{border-top:0; padding-top:2px;}
  .m-node:hover b{color:var(--accent);}
  .m-node i{font-style:normal; font-size:.875em; color:var(--accent); padding-top:3px;}
  .m-node b{
    display:block; font-family:Georgia,"Times New Roman",serif;
    font-size:1.25em; font-weight:600; color:var(--ink);
  }
  .m-node b em{
    font-style:normal; font-family:-apple-system,"PingFang SC",sans-serif;
    font-size:.68em; font-weight:400; color:var(--muted); margin-left:6px;
    white-space:nowrap;
  }
  .m-node small{display:block; margin-top:3px; font-size:.9375em; line-height:1.55; color:var(--ink-2);}
  .m-fold-body{padding:2px 0 4px;}
  .g-part{
    display:grid; grid-template-columns:24px minmax(0,1fr); gap:9px;
    padding:12px 0 0; margin-top:12px; border-top:1px dashed var(--rule);
  }
  .g-part:first-of-type{border-top:0; margin-top:0; padding-top:0;}
  .g-no{font-size:.875em; color:var(--accent); padding-top:3px;}
  .g-nm{font-size:1.1875em; font-weight:600; color:var(--ink);}
  .g-nm em{font-style:normal; font-weight:400; font-size:.684em; color:var(--muted); margin-left:6px;}
  .g-rl{font-size:.96875em; color:var(--accent); margin-top:3px;}
  .g-tx{font-family:Georgia,serif; font-size:1.09375em; line-height:1.6; color:var(--ink-2); margin-top:4px;}
  .g-nt{font-size:.96875em; line-height:1.65; color:var(--muted); margin-top:4px;}
  /* 词条 */
  .n-back{
    font:inherit; font-size:.96875em; color:var(--muted); background:none; border:0;
    padding:0 0 12px; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .n-back:hover{color:var(--accent);}
  .n-w{display:flex; align-items:baseline; gap:10px;}
  .n-w b{font-family:Georgia,serif; font-size:2.125em; font-weight:600; letter-spacing:-.01em;}
  .n-w span{font-size:.96875em; color:var(--muted); font-family:Georgia,serif;}
  /* 词卡：先给英文释义，中文释义折起来按需打开 */
  .n-def{margin:9px 0 0; font-size:1.09375em; line-height:1.65; color:var(--ink);}
  .n-def i{font-style:normal; font-size:.8em; color:var(--muted); margin-right:6px;}
  .n-fold{margin-top:9px;}
  .n-fold summary{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; list-style:none;
    font-size:.9375em; color:var(--muted); padding:2px 0;
  }
  .n-fold summary::-webkit-details-marker{display:none;}
  .n-fold summary::before{content:'＋'; font-size:.9em; color:var(--muted);}
  .n-fold[open] summary::before{content:'−';}
  .n-fold-body{
    margin-top:4px; padding:8px 11px; background:#fff;
    border:1px solid var(--rule); border-radius:8px;
    font-size:1.03125em; line-height:1.65; color:var(--ink-2);
  }
  .n-rows{margin-top:16px; display:flex; flex-direction:column; gap:13px;}
  .n-r{display:grid; grid-template-columns:2.4em minmax(0,1fr); gap:8px;}
  .n-r dt{font-size:.84375em; font-weight:600; color:var(--accent); padding-top:4px;}
  .n-r dd{margin:0; font-size:1.15625em; line-height:1.65; color:var(--ink-2);}
  .n-r dd em{font-style:normal; display:block; color:var(--muted); font-size:.811em; margin-top:3px;}
  /* 引线 */
  .bk-lead{position:absolute; inset:0; pointer-events:none; overflow:visible;}
  .bk-lead path{fill:none; stroke:var(--accent); stroke-width:1.4; opacity:.55;}
  .bk-pno{
    position:absolute; left:20px; bottom:16px;
    font-family:Georgia,serif; font-size:11px; color:rgba(0,0,0,.28);
    pointer-events:none;
  }
  /* 底部 Dock：居中落在页边下沿，不压书页、不压讲解正文 */
  .sk-dock{
    left:auto; right:calc(var(--sk-mw) / 2); transform:translateX(50%);
    bottom:12px; gap:1px; padding:4px 6px 5px; border-radius:16px;
    background:rgba(250,248,242,.96);
  }
  .sk-dock-item{width:auto; min-width:44px; height:40px; padding:0 10px; font-size:14px; border-radius:11px;}
  .sk-dock-item.has-txt{min-width:44px; padding:0 10px; font-size:14px;}
  .sk-dock-txt{font-size:13px; letter-spacing:0;}
  .sk-dock-item::after{bottom:auto; top:-20px;}
  /* 「整篇」是总，后面几项是分：留一道呼吸，不用符号 */
  .sk-dock-item[data-key="map"]{margin-right:6px;}
  /* 字号调节与「收起」各自成组，和阅读导航隔开 */
  .sk-dock-item[data-key="fs-down"]{margin-left:6px;}
  .sk-dock-item[data-key="close"]{margin-left:6px;}
  /* 七项 Dock 在窄屏会压到左下角页码，页码让位 */
  @media (max-width:1460px){.bk-pno{display:none;}}
  @media (max-width:1100px){
    .sk-dock-item,.sk-dock-item.has-txt{padding:0 7px; min-width:40px;}
    .sk-dock-txt{font-size:12.5px;}
  }
  @media (max-width:900px){
    :root{--margin-w:380px;}
    .bk-resize{display:none;}
  }
</style>
</head>
<body>
<div class="bk-stage">
  <div class="bk-view" id="view">
    <div class="bk-canvas" id="canvas">
      <img class="bk-img" id="img" src="../assets/textbook/bx1/u3-rt-p38-page.webp" alt="课本 p38">
      <div class="bk-hits" id="hits"></div>
    </div>
  </div>

  <aside class="bk-margin" id="margin">
    <div class="bk-hint" id="hint">
      <b>点书上的句子</b>
      <span>页边按「读懂 → 词块 → 句型 → 写法」讲这一句。<br>点段名看这一段，点 LIVING LEGENDS 看整篇。<br>滚轮放大，按住纸拖动，← → 换句。</span>
    </div>
    <div class="note" id="note"></div>
    <span class="bk-pno">p. 38</span>
  </aside>

  <div class="bk-resize" id="resize" title="拖动调整讲解区宽度"></div>
  <svg class="bk-lead" id="lead"></svg>
</div>

<!-- 全站登录门禁（功能页强制登录） -->
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/cloud.js"></script>
<script src="../shared/gate.js"></script>

<script src="../shared/ui/dock.js"></script>
<script src="../data/textbook_reading_notes.js"></script>
<script>
(function(){
  'use strict';

  var IMG_W = 1241, IMG_H = 1754;

  // 每句在整页图上的分段矩形 [x1, y, x2]，y 统一按行高铺满
  // sec = 所属段落（0 Intro / 1 Lang Ping / 2 Michael Jordan / 3 Your Suggestions）
  var SENT = [
    {
      sec: 0,
      en: "Help us choose some \u201cLiving Legends of Sports\u201d.",
      zh: "请帮我们评选一些“体育界的传奇人物”。",
      say: "杂志在向读者发出邀请：帮我们选一选，谁配得上“体育界的传奇人物”。",
      chunk: "help sb do sth 帮某人做某事",
      pat: "祈使句，主语 you 省略，像编辑当面说话。",

    hits.querySelectorAll('.hit, .sec-hit, .map-hit').forEach(function(b){
      b.classList.toggle('hot', kind(b) === kind(t) && key(b) === key(t));
    });
  });
  hits.addEventListener('pointerleave', function(){
    if (st.mode) return;
    hits.querySelectorAll('.hot').forEach(function(b){ b.classList.remove('hot'); });
  });
  hits.addEventListener('click', function(e){
    if (st.moved) return;
    if (e.target.closest('.map-hit')) { openMap(); return; }
    var sec = e.target.closest('.sec-hit');
    if (sec) { openSection(parseInt(sec.getAttribute('data-sec'), 10)); return; }
    var t = e.target.closest('.hit');
    if (!t) return;
    open(parseInt(t.getAttribute('data-s'), 10));
  });

  // ── 镜头 ──
  function apply(){
    canvas.style.transform = 'translate(' + st.tx + 'px,' + st.ty + 'px) scale(' + st.z + ')';
    drawLead();
  }
  function easeOn(){ canvas.classList.add('ease'); }
  function easeOff(){ canvas.classList.remove('ease'); }

  function viewW(){ return view.clientWidth; }
  function viewH(){ return view.clientHeight; }

  // 统一镜头：把页面上一块内容（整页比例坐标）放进可视区。
  // 讲什么就框什么——句层框一句话，段层框整段，篇层框书名横幅。
  // 宽高同时约束，取「能完整放下」的最大倍率，再把这块内容居中。
  function frameBox(x1, y1, x2, y2, minZ, maxZ){
    var W = viewW(), H = viewH();
    var bw = Math.max(0.02, x2 - x1);
    var bh = Math.max(0.008, y2 - y1);
    var z = Math.min(W * 0.92 / (IMG_W * bw), H * 0.86 / (IMG_H * bh));
    z = Math.max(minZ, Math.min(maxZ, z));
    st.z = z;
    st.tx = W * 0.5 - ((x1 + x2) / 2) * IMG_W * z;
    st.ty = H * 0.46 - ((y1 + y2) / 2) * IMG_H * z;
    clamp();
  }
  function boxOfRects(rs){
    var x1 = 1, x2 = 0;
    rs.forEach(function(r){ x1 = Math.min(x1, r[0]); x2 = Math.max(x2, r[2]); });
    return [x1, rs[0][1], x2, rs[rs.length - 1][1] + LINE_H];
  }
  // 句层：所有句子共用一个倍率，换句时只上下移动，镜头不会一抽一抽地缩放
  var Z_SENT = 0;
  function sentZ(){
    if (Z_SENT) return Z_SENT;
    var z = 9;
    SENT.forEach(function(s){
      var b = boxOfRects(s.rects);
      z = Math.min(z, viewW() * 0.92 / (IMG_W * (b[2] - b[0])));
    });
    // 长句（开篇那句横跨整栏）要让整句进画面，倍率就得降下来
    Z_SENT = Math.max(1.2, Math.min(2.2, z));
    return Z_SENT;
  }
  // 句层：横向按句子自身居中，纵向保持同一套倍率
  function focus(s){
    var b = boxOfRects(SENT[s].rects);
    st.z = sentZ();
    st.tx = viewW() * 0.5 - ((b[0] + b[2]) / 2) * IMG_W * st.z;
    st.ty = viewH() * 0.46 - ((b[1] + b[3]) / 2) * IMG_H * st.z;
    clamp();
  }
  // 段层：从段首到段末整块进画面（用数据里的 hot 框）
  function focusSec(i){
    var d = (noteData.sections || [])[i];
    var b = d && d.hot
      ? [d.hot.x, d.hot.y, d.hot.x + d.hot.w, d.hot.y + d.hot.h]
      : (function(){
          var h = SEC_HIT.filter(function(x){ return x.s === i; })[0];
          return h ? [h.x1, h.y1, h.x2, h.y2] : null;
        })();
    if (!b) return;
    frameBox(b[0], b[1], b[2], b[3], 0.5, 1.35);
  }
  function wholePage(){
    var z = Math.min(viewW() / IMG_W, viewH() / IMG_H) * 0.94;
    st.z = z;
    st.tx = (viewW() - IMG_W * z) / 2;
    st.ty = (viewH() - IMG_H * z) / 2;
    easeOn(); apply();
    setTimeout(function(){ easeOff(); sync(); }, 700);
  }

  function clamp(){
    var w = IMG_W * st.z, h = IMG_H * st.z;
    st.tx = Math.min(viewW() * 0.6, Math.max(viewW() * 0.4 - w, st.tx));
    st.ty = Math.min(viewH() * 0.6, Math.max(viewH() * 0.4 - h, st.ty));
  }

  // 打开先看整页：像翻开一本书，先见全貌，再点进去
  // （首帧不加缓动，避免一进来先看到一次从 100% 缩到整页的抽动）
  function home(){
    var z = Math.min(viewW() / IMG_W, viewH() / IMG_H) * 0.94;
    st.z = z;
    st.tx = (viewW() - IMG_W * z) / 2;
    st.ty = (viewH() - IMG_H * z) / 2;
    apply();
  }

  function sync(){
    place();
    drawLead();
  }

  // ── 批注 ──
  function open(s){
    st.mode = 'sent'; st.s = s; st.sec = SENT[s].sec; st.lastSec = st.sec;
    st.card = '';
    st.anchor = null;
    hits.querySelectorAll('.hit').forEach(function(b){
      var on = b.getAttribute('data-s') === String(s);
      b.classList.toggle('on', on);
      b.classList.toggle('hot', false);
      if (on && !st.anchor) st.anchor = b;
    });
    hits.querySelectorAll('.sec-hit, .map-hit').forEach(function(b){
      b.classList.remove('on', 'hot');
    });
    hint.classList.add('gone');
    renderNote(s);
    paintDock();
    easeOn();
    focus(s);
    apply();
    setTimeout(function(){ easeOff(); sync(); }, 700);
  }

  function openSection(i){
    var secs = noteData.sections || [];
    if (!secs[i]) return;
    // 从逐句里点「本段」回来不丢刚写的骨架；重新进这一段讲，则从空白开始
    var sameSec = st.mode === 'sent' && st.sec === i;
    st.mode = 'sec'; st.sec = i; st.s = -1; st.lastSec = i;
    st.card = '';
    st.anchor = null;
    if (!sameSec) st.skel[i] = 0;
    hits.querySelectorAll('.hit, .map-hit').forEach(function(b){ b.classList.remove('on', 'hot'); });
    hits.querySelectorAll('.sec-hit').forEach(function(b){
      var on = b.getAttribute('data-sec') === String(i);
      b.classList.toggle('on', on);
      b.classList.toggle('hot', false);
      if (on) st.anchor = b;
    });
    hint.classList.add('gone');
    renderSection(i);
    paintDock();
    easeOn();
    focusSec(i);
    apply();
    setTimeout(function(){ easeOff(); sync(); }, 700);
  }

  function openMap(){
    st.mode = 'map'; st.s = -1; st.sec = -1; st.anchor = null;
    st.card = '';
    hits.querySelectorAll('.hit, .sec-hit').forEach(function(b){ b.classList.remove('on', 'hot'); });
    var box = hits.querySelector('.map-hit');
    if (box) { box.classList.add('on'); box.classList.remove('hot'); st.anchor = box; }
    hint.classList.add('gone');
    renderMap();
    paintDock();
    wholePage();
    setTimeout(function(){ easeOff(); sync(); }, 700);
  }

  function close(){
    var wasOpen = st.mode !== '';
    st.mode = ''; st.s = -1; st.sec = -1; st.anchor = null; st.card = '';
    st.skel = {};
    note.classList.remove('in');
    hits.querySelectorAll('.on,.hot').forEach(function(b){ b.classList.remove('on','hot'); });
    lead.innerHTML = '';
    hint.classList.remove('gone');
    paintDock();
    if (wasOpen) wholePage();
  }

  // ── 底部 Dock：整篇 / 本段 / 本句 / 生词 / 字号 ──
  var dockApi = null;

  // 这一段的第一句在全文里的序号
  function firstSentOfSection(i){
    for (var k = 0; k < SENT.length; k++) if (SENT[k].sec === i) return k;
    return 0;
  }

  // 讲解字号：基准值已在 CSS 里按屏高定好，这里只做等比增减。
  // 默认停在中间档，让字卡、句卡一屏大致占到面板高度的 3/4。
  var FS_STEPS = [0.82, 0.91, 1, 1.12, 1.25];
  var fsIdx = 2;
  try {
    var savedFs = parseInt(localStorage.getItem('seeklume.readingNoteFs'), 10);
    if (savedFs >= 0 && savedFs < FS_STEPS.length) fsIdx = savedFs;
  } catch (err) {}
  function applyFs(){
    margin.style.setProperty('--ns', FS_STEPS[fsIdx]);
    place();
  }
  function stepFs(dir){
    var n = Math.max(0, Math.min(FS_STEPS.length - 1, fsIdx + dir));
    if (n === fsIdx) return;
    fsIdx = n;
    try { localStorage.setItem('seeklume.readingNoteFs', String(fsIdx)); } catch (err) {}
    applyFs();
  }

  // Dock 跟着当前层级换：句层给上一句/下一句，段层给上一段/下一段，
  // 篇层只留回书页和生词。同类动作不再全都堆在一排里打架。
  function dockItems(){
    var items = [];
    function add(key, text, label, fn){
      items.push({ key: key, text: text, label: label, onSelect: fn });
    }

    if (st.card === 'word') {
      add('back-sent', '回本句', '回到本句', function(){ renderNote(st.s); });
      add('prev-sent', '上一句', '上一句', function(){ if (st.s > 0) open(st.s - 1); });
      add('next-sent', '下一句', '下一句', function(){ if (st.s < SENT.length - 1) open(st.s + 1); });
      add('sec', '本段', '本段', function(){ openSection(SENT[st.s].sec); });
      add('close', '收起', '收起（Esc）', close);
      return items;
    }

    if (st.card === 'skel') {
      add('back-sent', '回本句', '回到本句', function(){ renderNote(st.s); });
      add('sec', '本段', '本段', function(){ openSection(st.lastSec); });
      add('map', '整篇', '整篇（M）', openMap);
      add('close', '收起', '收起（Esc）', close);
      return items;
    }

    if (st.mode === 'map') {
      add('back-book', '回书页', '回到书页', close);
      add('words', '生词', '生词', function(){ openWordList(); });
      add('close', '收起', '收起（Esc）', close);
      return items;
    }

    if (st.mode === 'words') {
      add('back-book', '回书页', '回到书页', close);
      add('map', '整篇', '整篇（M）', openMap);
      add('close', '收起', '收起（Esc）', close);
      return items;
    }

    if (st.mode === 'sec') {
      add('prev-sec', '上一段', '上一段', function(){ if (st.sec > 0) openSection(st.sec - 1); });
      add('next-sec', '下一段', '下一段', function(){ if (st.sec < (noteData.sections || []).length - 1) openSection(st.sec + 1); });
      add('sent', '逐句', '逐句读这一段', function(){ open(firstSentOfSection(st.sec)); });
      add('map', '整篇', '整篇（M）', openMap);
      add('words', '生词', '生词', function(){ openWordList(); });
      add('close', '收起', '收起（Esc）', close);
      return items;
    }

    if (st.mode === 'sent') {
      add('prev-sent', '上一句', '上一句', function(){ if (st.s > 0) open(st.s - 1); });
      add('next-sent', '下一句', '下一句', function(){ if (st.s < SENT.length - 1) open(st.s + 1); });
      add('sec', '本段', '本段', function(){ openSection(SENT[st.s].sec); });
      add('map', '整篇', '整篇（M）', openMap);
      add('fs-down', '字小', '讲解字号调小', function(){ stepFs(-1); });
      add('fs-up', '字大', '讲解字号调大', function(){ stepFs(1); });
      add('close', '收起', '收起（Esc）', close);
      return items;
    }

    // 还没打开任何卡片：只给两个入口
    add('map', '整篇', '整篇（M）', openMap);
    add('words', '生词', '生词', function(){ openWordList(); });
    return items;
  }

  function paintDock(){
    if (!window.SeeklumeDock) return;
    dockApi = window.SeeklumeDock.mount({
      items: dockItems(),
      active: ''
    });
  }

  function openWordList(){
    st.mode = 'words'; st.s = -1; st.sec = -1; st.anchor = null; st.card = '';
    hits.querySelectorAll('.on,.hot').forEach(function(b){ b.classList.remove('on','hot'); });
    lead.innerHTML = '';
    hint.classList.add('gone');
    renderWordList();
    paintDock();
  }

  function renderWordList(){
    var chips = PAGE_WORDS.map(function(w){
      var c = WORDS[w.card] || {};
      return '<button class="n-chip" data-card="' + esc(w.card) + '" data-s="' + w.s +
        '" data-w="' + esc(w.text) + '">' + esc(w.text) +
        '<i>' + esc(c.zh || '') + ' · 句 ' + (w.s + 1) + '</i></button>';
    }).join('');

    note.innerHTML =
      '<div class="n-kicker"><span>本页生词 / ' + PAGE_WORDS.length + ' 个</span><i class="n-rule"></i></div>' +
      '<div class="m-head"><b>单词也能单独讲</b><span>点一个词，镜头回到它所在的句子</span></div>' +
      '<div class="n-words">' + chips + '</div>';

    note.querySelectorAll('.n-chip').forEach(function(b){
      b.addEventListener('click', function(){
        var card = WORDS[b.getAttribute('data-card')];
        if (!card) return;
        var s = parseInt(b.getAttribute('data-s'), 10);
        open(s);
        renderWord(card, s, b.getAttribute('data-w'));
      });
    });

    note.scrollTop = 0;
    note.classList.remove('in');
    void note.offsetWidth;
    note.classList.add('in');
  }

  // ── 复述骨架：不按句子硬绑，老师讲完一组点一下，按 notes 顺序写下一条 ──
  function skelRow(n, isNew){
    var lv = n.lv || 0;
    return '<div class="s-note lv' + lv + (isNew ? ' new' : '') + '" style="padding-left:' + (lv * 15) + 'px">' +
      (lv === 0 ? '<span class="s-note-dot"></span>' : '') +
      esc(n.txt || '') +
      (n.gloss ? '<em>' + esc(n.gloss) + '</em>' : '') +
    '</div>';
  }

  function skelBlock(d, s, fresh){
    var ns = (noteData.sections[d.sec] || {}).notes || [];
    var count = st.skel[d.sec] || 0;
    var rows = '';
    for (var k = 0; k < count && k < ns.length; k++) {
      rows += skelRow(ns[k], fresh === k);
    }
    var complete = ns.length > 0 && count >= ns.length;
    return '<div class="n-skel' + (complete ? ' full' : '') + '">' +
      '<div class="n-skel-cap">' +
        '<span>' + (complete ? '本段骨架 · 完整'
          : '复述骨架 · ' + esc((noteData.sections[d.sec] || {}).label || '')) + '</span>' +
        (complete
          ? '<button type="button" class="n-skel-btn" data-skel-show>总展示</button>'
          : '<button type="button" class="n-skel-btn" data-skel>写下一条</button>') +
      '</div>' +
      (rows ? '<div class="n-skel-list">' + rows + '</div>' : '') +
      (complete ? '<p class="n-skel-done">这一段讲完了，点「总展示」让学生看整副骨架。</p>' : '') +
    '</div>';
  }

  function bindSkel(d, s){
    var show = note.querySelector('[data-skel-show]');
    if (show) {
      show.addEventListener('click', function(){ renderSkelSummary(d.sec, s); });
      return;
    }
    var btn = note.querySelector('[data-skel]');
    if (!btn) return;
    btn.addEventListener('click', function(){
      var ns = (noteData.sections[d.sec] || {}).notes || [];
      var count = st.skel[d.sec] || 0;
      if (count >= ns.length) return;
      // 与当前讲到第几句无关：老师讲完一组，点一下，按 notes 顺序写下一条
      st.skel[d.sec] = count + 1;
      var box = note.querySelector('.n-skel');
      if (!box) return;
      // 只换骨架这一块：书页和这一句的讲解都不动
      box.outerHTML = skelBlock(d, s, count);
      bindSkel(d, s);
      var nb = note.querySelector('.n-skel');
      if (!nb) return;
      var freshRow = nb.querySelector('.s-note.new');
      if (freshRow) freshRow.scrollIntoView({ block: 'nearest' });
      requestAnimationFrame(place);
    });
  }

  // 一段讲完：把整副骨架单独铺开，学生看总展示
  function renderSkelSummary(secIdx, s){
    var d = (noteData.sections || [])[secIdx] || {};
    var ns = d.notes || [];
    var count = st.skel[secIdx] || 0;
    var rows = ns.slice(0, count).map(function(n){ return skelRow(n, false); }).join('');
    st.card = 'skel';
    note.innerHTML =
      '<button type="button" class="n-back" id="nBack">← 回到第 ' + (s + 1) + ' 句</button>' +
      '<div class="s-head"><b>' + esc(d.label || '') + '</b><span>' + esc(d.short || '') + '</span></div>' +
      (d.role ? '<div class="s-role">' + esc(d.role) + '</div>' : '') +
      '<div class="s-sec"><div class="s-cap">复述骨架 · 照着它把这一段讲一遍</div>' +
        '<div class="n-skel-list skel-sum">' + rows + '</div></div>';
    note.querySelector('#nBack').addEventListener('click', function(){ renderNote(s); });
    note.classList.remove('in');
    void note.offsetWidth;
    note.classList.add('in');
    note.scrollTop = 0;
    paintDock();
    requestAnimationFrame(place);
  }

  function renderNote(s){
    st.card = '';
    var d = SENT[s];
    // 句卡里的词只露词形，释义点开词卡再看——省地方，也更像课堂上的一个“抓手”
    var chips = (d.words || []).map(function(w){
      return '<button class="n-chip" data-card="' + esc(w.card) + '" data-w="' + esc(w.text) + '">' +
        esc(w.text) + '</button>';
    }).join('');

    note.innerHTML =
      '<div class="n-kicker"><span>第 ' + (s + 1) + ' 句 / ' + SENT.length +
        (SEC_NAV[d.sec] ? ' · ' + SEC_NAV[d.sec] : '') + '</span>' +
        '<i class="n-rule"></i>' +
        '<span class="n-nav">' +
          '<button type="button" data-nav="-1"' + (s === 0 ? ' disabled' : '') + ' aria-label="上一句">‹</button>' +
          '<button type="button" data-nav="1"' + (s === SENT.length - 1 ? ' disabled' : '') + ' aria-label="下一句">›</button>' +
        '</span>' +
      '</div>' +
      (d.say ? '<div class="n-row"><span class="n-lab">读懂</span><span class="n-val">' + esc(d.say) + '</span></div>' : '') +
      (d.chunk ? '<div class="n-row"><span class="n-lab">词块</span><span class="n-val">' + esc(d.chunk) + '</span></div>' : '') +
      (d.pat ? '<div class="n-row"><span class="n-lab">句型</span><span class="n-val">' + esc(d.pat) + '</span></div>' : '') +
      (d.craft ? '<div class="n-row"><span class="n-lab">写法</span><span class="n-val">' + esc(d.craft) + '</span></div>' : '') +
      (chips ? '<div class="n-words"><span class="n-words-cap">讲单词</span>' + chips + '</div>' : '') +
      (((noteData.sections[d.sec] || {}).notes || []).length ? skelBlock(d, s) : '');

    bindSkel(d, s);

    note.querySelectorAll('.n-wk, .n-chip').forEach(function(b){
      b.addEventListener('click', function(){
        var card = WORDS[b.getAttribute('data-card')];
        if (card) renderWord(card, s, b.getAttribute('data-w') || b.textContent);
      });
    });
    note.querySelectorAll('[data-nav]').forEach(function(b){
      b.addEventListener('click', function(){
        var n = s + parseInt(b.getAttribute('data-nav'), 10);
        if (n >= 0 && n < SENT.length) open(n);
      });
    });

    note.classList.remove('in');
    void note.offsetWidth;
    note.classList.add('in');
    note.scrollTop = 0;
    paintDock();
    requestAnimationFrame(place);
  }

  // 问题卡：先自己想 → 卡住了看提示 → 最后才对答案。
  // 答案默认藏着，学生不会被一大段英文吓退。
  function qList(list){
    return (list || []).map(function(q, k){
      return '<div class="s-q">' +
        '<button type="button" class="s-qq">' +
          '<i>Q' + (k + 1) + '</i><span>' + esc(q.q) + '</span>' +
        '</button>' +
        '<div class="s-qa">' +
          (q.hint ? '<div class="s-hint"><b>卡住了？先走这一步</b>' + esc(q.hint) + '</div>' : '') +
          '<button type="button" class="s-reveal">对答案</button>' +
          '<div class="s-ans"><b>参考答案</b><span>' + esc(q.a) + '</span></div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  // 所有问题卡共用一套交互：点题展开，点「对答案」才亮答案
  function bindQuestions(root){
    root.querySelectorAll('.s-qq').forEach(function(b){
      b.addEventListener('click', function(){
        var row = b.parentNode;
        row.classList.toggle('open');
        // 展开后把这题带到面板顶部：提示和答案从一页干净的地方开始
        if (row.classList.contains('open')) row.scrollIntoView({ block: 'start' });
        place();
      });
    });
    root.querySelectorAll('.s-reveal').forEach(function(b){
      b.addEventListener('click', function(){
        var row = b.parentNode.parentNode;
        row.classList.add('revealed');
        row.scrollIntoView({ block: 'nearest' });
        place();
      });
    });
  }

  // ── 段卡：这一段在文章里干什么 + 问题 + 段译 ──
  // 复述骨架不在段卡出现：逐句讲的时候，老师写一句、点一句，骨架才长出来。
  function renderSection(i){
    var secs = noteData.sections || [];
    var d = secs[i]; if (!d) return;

    var qs = qList(d.inquiry);

    var tr = (d.translation || []).map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('');

    var crafts = (d.crafts || []).map(function(c){
      return '<div class="s-craft"><b>' + esc(c.name) + '</b><span>' + esc(c.how) + '</span></div>';
    }).join('');

    var first = firstSentOfSection(i);
    var sentCount = SENT.filter(function(x){ return x.sec === i; }).length;

    note.innerHTML =
      '<div class="n-kicker"><span>第 ' + (i + 1) + ' 段 / 共 ' + secs.length + ' 段</span>' +
        '<i class="n-rule"></i>' +
        '<span class="n-nav">' +
          '<button type="button" data-nav="-1"' + (i === 0 ? ' disabled' : '') + ' aria-label="上一段">‹</button>' +
          '<button type="button" data-nav="1"' + (i === secs.length - 1 ? ' disabled' : '') + ' aria-label="下一段">›</button>' +
        '</span>' +
      '</div>' +
      '<div class="s-head"><b>' + esc(d.label) + '</b><span>' + esc(d.short || '') + '</span></div>' +
      (d.role ? '<div class="s-role">' + esc(d.role) + '</div>' : '') +
      (d.gist ? '<p class="s-gist">' + esc(d.gist) + '</p>' : '') +
      (qs ? '<div class="s-sec"><div class="s-cap">问题 · 先自己想，卡住了看提示，最后对答案（英文作答）</div>' + qs + '</div>' : '') +
      (crafts ? '<details class="s-fold"><summary>这一段的手法</summary><div class="s-crafts">' + crafts + '</div></details>' : '') +
      (tr ? '<details class="s-fold"><summary>这一段的中文</summary><div class="s-tr">' + tr + '</div></details>' : '') +
      (sentCount ? '<button type="button" class="s-jump" id="sJump">逐句读这一段（' + sentCount + ' 句）→</button>' : '');

    bindQuestions(note);
    note.querySelectorAll('[data-nav]').forEach(function(b){
      b.addEventListener('click', function(){
        var n = i + parseInt(b.getAttribute('data-nav'), 10);
        if (n >= 0 && n < secs.length) openSection(n);
      });
    });
    var jump = note.querySelector('#sJump');
    if (jump) jump.addEventListener('click', function(){ open(first); });

    note.classList.remove('in');
    void note.offsetWidth;
    note.classList.add('in');
    note.scrollTop = 0;
    requestAnimationFrame(place);
  }

  // ── 篇卡：一屏看完整篇骨架 —— 四段各干什么，点一段进段卡 ──
  // 不再用「读前→扫读→骨架→认门→读后」五步翻页：课堂上老师要的是
  // 一眼看见全文，而不是连点五次下一步。
  function renderMap(){
    var d = noteData;
    var secs = d.sections || [];
    var inq = d.inquiry || {};
    var pre = qList(inq.pre);
    var post = qList(inq.post);

    var spine = secs.map(function(s, k){
      return '<button type="button" class="m-node" data-open-sec="' + k + '">' +
        '<i>' + ('0' + (k + 1)).slice(-2) + '</i>' +
        '<span><b>' + esc(s.label) + '<em>' + esc(s.short || '') + '</em></b>' +
          '<small>' + esc(s.role || '') + '</small></span>' +
      '</button>';
    }).join('');

    var parts = (d.genreParts || []).map(function(p){
      return '<div class="g-part">' +
        '<span class="g-no">' + esc(p.no) + '</span><div>' +
          '<div class="g-nm">' + esc(p.name) + '<em>' + esc(p.en) + '</em></div>' +
          '<div class="g-rl">' + esc(p.role) + '</div>' +
          '<div class="g-tx">' + esc(p.text) + '</div>' +
          '<div class="g-nt">' + esc(p.note) + '</div>' +
        '</div></div>';
    }).join('');

    note.innerHTML =
      '<div class="n-kicker"><span>整篇 / ' + secs.length + ' 段</span>' +
        '<i class="n-rule"></i>' +
        '<span class="n-nav"><button type="button" class="m-close" data-map-close>收起</button></span>' +
      '</div>' +
      '<div class="m-head"><b>' + esc(d.title) + '</b><span>' + esc(d.sub || '') + '</span></div>' +
      '<p class="m-guide">先带着问题读；读完后，用这四段把全文串起来。点任意一段进段卡。</p>' +
      '<div class="m-spine">' + spine + '</div>' +
      (pre ? '<details class="s-fold"><summary>读前 · 带着问题读（' + (inq.pre || []).length +
        '）</summary><div class="m-fold-body">' + pre + '</div></details>' : '') +
      (parts ? '<details class="s-fold"><summary>这一类文章的骨架 · 五部件</summary>' +
        '<div class="m-fold-body">' + parts + '</div></details>' : '') +
      (post ? '<details class="s-fold"><summary>读后 · 合起来想（' + (inq.post || []).length +
        '）</summary><div class="m-fold-body">' + post + '</div></details>' : '');

    bindQuestions(note);
    note.querySelectorAll('[data-open-sec]').forEach(function(b){
      b.addEventListener('click', function(){
        openSection(parseInt(b.getAttribute('data-open-sec'), 10));
      });
    });
    note.querySelectorAll('[data-map-close]').forEach(function(b){
      b.addEventListener('click', close);
    });

    note.classList.remove('in');
    void note.offsetWidth;
    note.classList.add('in');
    note.scrollTop = 0;
    requestAnimationFrame(place);
  }

  function row(label, val){
    return '<div class="n-r"><dt>' + label + '</dt><dd>' + val + '</dd></div>';
  }

  function renderWord(cd, s){
    st.card = 'word';
    var rows = '';
    if (cd.root) {
      rows += row('词根', '<b>' + esc(cd.root.seg || '') + '</b>　' + esc(cd.root.mean || '') +
        ((cd.root.kin && cd.root.kin.length) ? '<em>同源：' + cd.root.kin.map(esc).join(' · ') + '</em>' : ''));
    }
    if (cd.affix && cd.affix.length) {
      rows += row('构词', cd.affix.map(function(a){
        return esc(a.af) + ' ' + esc(a.mean) + '　' + esc(a.ex);
      }).join('<br>'));
    }
    if (cd.family && cd.family.length) rows += row('词族', cd.family.map(esc).join('<br>'));
    if (cd.chunks && cd.chunks.length) rows += row('词块', cd.chunks.map(esc).join('<br>'));
    if (cd.pitfall) rows += row('注意', esc(cd.pitfall));
    if (cd.use) rows += row('用', esc(cd.use));

    note.innerHTML =
      '<button class="n-back" id="nBack">← 回到第 ' + (s + 1) + ' 句</button>' +
      '<div class="n-w"><b>' + esc(cd.w) + '</b>' + (cd.ipa ? '<span>' + esc(cd.ipa) + '</span>' : '') + '</div>' +
      (cd.en ? '<p class="n-def">' + (cd.pos ? '<i>' + esc(cd.pos) + '</i>' : '') + esc(cd.en) + '</p>' : '') +
      (cd.zh ? '<details class="n-fold"><summary>中文释义</summary><div class="n-fold-body">' + esc(cd.zh) + '</div></details>' : '') +
      '<div class="n-rows">' + rows + '</div>';

    note.querySelector('#nBack').addEventListener('click', function(){ renderNote(s); });
    note.scrollTop = 0;
    note.classList.remove('in');
    void note.offsetWidth;
    note.classList.add('in');
    paintDock();
    requestAnimationFrame(place);
  }

  // 讲解卡高度跟内容走；引线从书上的句子指到卡片左上角
  function place(){ drawLead(); }

  function drawLead(){
    if (!st.anchor) { lead.innerHTML = ''; return; }
    var sb = document.querySelector('.bk-stage').getBoundingClientRect();
    var hb = st.anchor.getBoundingClientRect();
    var nb = note.getBoundingClientRect();
    var x1 = hb.right - sb.left, y1 = hb.top - sb.top + hb.height / 2;
    var x2 = nb.left - sb.left;
    // 卡高随内容走，终点固定落在卡片顶缘，避免指到卡内某一句话上
    var y2 = nb.top - sb.top + 14;
    if (x2 <= x1) { lead.innerHTML = ''; return; }
    var mx = (x1 + x2) / 2;
    lead.setAttribute('viewBox', '0 0 ' + sb.width + ' ' + sb.height);
    lead.innerHTML = '<path d="M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2 + '"/>';
  }

  // ── 拖动 / 缩放 ──
  var down = null;
  view.addEventListener('pointerdown', function(e){
    if (e.button !== 0) return;
    st.drag = true; st.moved = false;
    down = { x: e.clientX, y: e.clientY, tx: st.tx, ty: st.ty };
    easeOff();
  });
  view.addEventListener('pointermove', function(e){
    if (!st.drag) return;
    var dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (!st.moved && Math.abs(dx) + Math.abs(dy) > 4) {
      st.moved = true; view.classList.add('dragging');
      try { view.setPointerCapture(e.pointerId); } catch(err){}
    }
    if (!st.moved) return;
    st.tx = down.tx + dx; st.ty = down.ty + dy;
    clamp(); apply(); sync();
  });
  view.addEventListener('pointerup', function(){
    st.drag = false;
    view.classList.remove('dragging');
    setTimeout(function(){ st.moved = false; }, 0);
  });

  view.addEventListener('wheel', function(e){
    e.preventDefault();
    var r = view.getBoundingClientRect();
    var mx = e.clientX - r.left, my = e.clientY - r.top;
    var f = Math.exp(-e.deltaY * 0.0016);
    var z2 = Math.max(0.35, Math.min(5, st.z * f));
    var k = z2 / st.z;
    st.tx = mx - (mx - st.tx) * k;
    st.ty = my - (my - st.ty) * k;
    st.z = z2; clamp(); apply(); sync();
  }, { passive: false });

  // ── 键盘 ──
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      var dir = e.key === 'ArrowRight' ? 1 : -1;
      if (st.mode === 'map') {
        // 篇卡是一屏总览，不翻页
        return;
      } else if (st.mode === 'sec') {
        openSection(Math.max(0, Math.min(SEC_HIT.length - 1, st.sec + dir)));
      } else {
        open(Math.max(0, Math.min(SENT.length - 1, st.s < 0 ? 0 : st.s + dir)));
      }
    } else if (e.key === 'm' || e.key === 'M') {
      openMap();
    } else if (e.key === 'Escape') {
      close();
    } else if (e.key === '0') {
      wholePage();
    } else if (e.key === '+' || e.key === '=') {
      st.z = Math.min(5, st.z * 1.2); clamp(); apply(); sync();
    } else if (e.key === '-') {
      st.z = Math.max(0.35, st.z / 1.2); clamp(); apply(); sync();
    }
  });

  window.addEventListener('resize', function(){ Z_SENT = 0; clamp(); apply(); sync(); });
  canvas.addEventListener('transitionend', function(e){
    if (e.propertyName === 'transform') sync();
  });

  applyFs();
  home();
  paintDock();
})();
</script>
</body>
</html>
