<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seeklume · 口译笔记法（背课文用）</title>
<style>
  /* 纸面配色：和阅读课 book.html 同一套（桌面 · 纸 · 墨 · 金） */
  :root {
    --desk:#e8e5dd; --paper:#faf8f2; --ink:#2b2a26; --ink-2:#55524a;
    --muted:#8d8779; --rule:#ded7c7; --accent:#b98a28;
    --bg:var(--desk); --surface:var(--paper); --surface-2:#f5f1e6; --surface-3:#efeadf;
    --border:var(--rule); --text:var(--ink); --text-2:var(--ink-2); --text-3:var(--muted);
    --accent-bg:#f7edd6; --green:#5f7f4a; --green-bg:#eef3e6;
    --coral:#b4553f; --coral-bg:#fbece8; --amber:#b98a28; --amber-bg:#f7edd6;
    --font-display:Georgia,'Times New Roman','Songti SC',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
    --font-note:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding-bottom:96px;background:var(--desk);color:var(--ink);
    font-family:var(--font-body);-webkit-font-smoothing:antialiased;}

  /* ===== 页首常驻四格条：一进页面就把四件事摆在书页上方 ===== */
  .nm-guide{display:flex;flex-direction:column;justify-content:center;gap:6px;
    height:76px;padding:8px 18px;background:var(--paper);border-bottom:1px solid var(--rule);}
  .nm-guide-top{display:flex;align-items:center;gap:7px;min-width:0;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;}
  .nm-guide-top::-webkit-scrollbar{display:none;}
  .nm-guide-cap{flex:none;margin-right:3px;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);}
  .nm-cue{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);
    background:#fff;border-radius:999px;padding:6px 13px;font:inherit;font-size:14.5px;font-weight:600;
    color:var(--ink-2);cursor:pointer;white-space:nowrap;
    transition:border-color .16s,background .16s,color .16s;}
  .nm-cue b{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--accent);}
  .nm-cue:hover{border-color:var(--accent);color:var(--accent);}
  .nm-cue:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .nm-cue.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .nm-cue.on b{color:#fff;}
  /* 一条随段落变化的句子：不点也读得懂，点了就与页边笔记对上 */
  .nm-guide-say{font-size:14.5px;line-height:1.45;color:var(--ink-2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nm-guide-say b{margin-right:9px;color:var(--accent);font-weight:700;}
  .nm-guide.var-on .nm-guide-say b{color:var(--ink);}

  /* ===== 整屏书页 + 页边 ===== */
  .nm-book{display:grid;grid-template-columns:minmax(0,1fr) clamp(440px,32vw,560px);
    height:calc(100dvh - 160px);background:var(--desk);border-bottom:1px solid var(--rule);}

  .nm-view{position:relative;overflow:hidden;overflow:clip;background:var(--desk);touch-action:none;cursor:grab;}
  .nm-view.dragging{cursor:grabbing;}
  .nm-canvas{position:absolute;left:0;top:0;width:1241px;height:1754px;transform-origin:0 0;will-change:transform;}
  .nm-canvas.ease{transition:transform .62s cubic-bezier(.22,.61,.25,1);}
  .nm-page{display:block;width:1241px;height:1754px;user-select:none;-webkit-user-drag:none;
    box-shadow:0 2px 18px rgba(43,42,38,.14);}
  .nm-hots{position:absolute;inset:0;isolation:isolate;}
  .nm-hot{position:absolute;border:0;padding:0;border-radius:3px;background:transparent;
    cursor:pointer;transition:background .18s ease;}
  .nm-hot:hover{background:rgba(185,138,40,.08);}

  .nm-tools{position:absolute;right:14px;top:14px;display:flex;gap:6px;z-index:5;}
  .nm-tools button{min-width:32px;height:32px;padding:0 9px;border:1px solid var(--rule);border-radius:999px;
    background:rgba(250,248,242,.92);color:var(--ink-2);font:inherit;font-size:12.5px;cursor:pointer;
    box-shadow:0 1px 6px rgba(43,42,38,.10);}
  .nm-tools button:hover{border-color:var(--accent);color:var(--accent);}
  .nm-pno{position:absolute;left:16px;bottom:12px;font-family:var(--font-display);font-size:12px;
    color:var(--muted);letter-spacing:.04em;pointer-events:none;}

  /* 页边 */
  .nm-margin{position:relative;background:var(--paper);border-left:1px solid var(--rule);
    padding:18px 24px 14px;display:flex;flex-direction:column;overflow:hidden;--ns:1.3;}
  .nm-margin::before{content:'';position:absolute;left:9px;top:0;bottom:0;width:1px;
    background:linear-gradient(to bottom,transparent,var(--rule) 12%,var(--rule) 88%,transparent);
    opacity:.55;pointer-events:none;}

  .nm-m-top{display:flex;align-items:center;gap:8px;}
  .nm-m-back{color:var(--muted);text-decoration:none;font-size:13.5px;}
  .nm-m-back:hover{color:var(--accent);}
  .nm-m-pages{display:flex;gap:5px;margin-left:auto;}
  .nm-m-pages button{border:0;background:none;font:inherit;font-size:13.5px;color:var(--muted);
    padding:1px 2px;cursor:pointer;border-bottom:1px solid transparent;}
  .nm-m-pages button:hover{color:var(--ink);}
  .nm-m-pages button.on{color:var(--accent);border-bottom-color:var(--accent);}
  .nm-m-whole{border:1px solid var(--rule);background:#fff;border-radius:999px;font:inherit;
    font-size:12.5px;color:var(--ink-2);padding:3px 9px;cursor:pointer;}
  .nm-m-whole:hover{border-color:var(--accent);color:var(--accent);}

  .nm-m-head{margin-top:11px;}
  .nm-m-kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
  .nm-m-title{font-family:var(--font-display);font-size:29px;font-weight:600;letter-spacing:-.01em;
    margin:4px 0 0;line-height:1.1;}
  .nm-m-lead{margin:6px 0 0;font-size:14px;line-height:1.7;color:var(--muted);}

  /* —— 页边主视觉：整篇骨架 —— */
  .nm-map-cap{display:flex;align-items:center;gap:10px;margin:8px 0 0;
    font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .nm-map-cap .r{flex:1;height:1px;background:var(--rule);}
  .nm-map{margin-top:6px;display:flex;flex-direction:column;}
  .nm-map-root{display:grid;grid-template-columns:15px minmax(0,1fr);gap:10px;padding:2px 2px 8px;}
  .nm-map-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:9px;}
  .nm-map-root-txt{font-family:var(--font-display);font-size:calc(24px * var(--ns));font-weight:600;line-height:1.28;}
  .nm-map-root-gl{font-size:calc(12px * var(--ns));color:var(--muted);margin-top:4px;}
  .nm-map-branch{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;align-items:baseline;
    width:100%;border:0;border-top:1px solid #ece6d8;background:none;font:inherit;text-align:left;
    padding:9px 4px;cursor:pointer;transition:background .16s;}
  .nm-map-branch:hover{background:var(--surface-2);}
  .nm-map-branch:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .nm-map-dash{width:14px;height:2px;background:var(--accent);opacity:.65;align-self:center;}
  .nm-map-name{font-size:calc(20px * var(--ns));font-weight:600;color:var(--ink);line-height:1.35;}
  .nm-map-gl{font-size:calc(12px * var(--ns));color:var(--muted);white-space:nowrap;}
  .nm-map-note{margin:8px 0 0;font-size:calc(12px * var(--ns));line-height:1.55;color:var(--muted);}
  .nm-map-hint{margin:6px 0 0;font-size:calc(12px * var(--ns));font-weight:600;color:var(--accent);}

  .nm-back{display:inline-flex;align-items:center;gap:5px;margin:2px 0 0;padding:6px 13px;
    border:1px solid var(--rule);border-radius:999px;background:#fff;font:inherit;
    font-size:14.5px;font-weight:600;color:var(--accent);cursor:pointer;}
  .nm-back:hover{border-color:var(--accent);background:#fffdf7;}

  /* —— 页边笔记树：金色圆点起头，分支用课本同款 T 形符号 —— */
  .nm-tree{display:flex;flex-direction:column;margin-top:3px;}
  .nm-t-row{display:grid;grid-template-columns:16px minmax(0,1fr);gap:9px;padding:6px 0;align-items:start;}
  .nm-t-row.lv1{padding-left:18px;}
  .nm-t-row.lv2{padding-left:38px;}
  .nm-t-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:14px;}
  .nm-t-br{font-family:var(--font-note);font-size:calc(19px * var(--ns));line-height:1.2;
    color:var(--accent);opacity:.55;text-align:center;}
  .nm-t-row.lv1>.nm-t-br{opacity:.8;}
  .nm-t-row.lv2>.nm-t-br{opacity:.6;}
  .nm-t-sym{font-size:15.5px;line-height:1.3;color:var(--accent);text-align:center;}
  .nm-t-txt{display:block;font-family:var(--font-note);font-size:calc(18px * var(--ns));font-weight:600;
    line-height:1.45;color:var(--ink);overflow-wrap:anywhere;}
  .nm-t-row.lv1 .nm-t-txt{font-size:calc(16.5px * var(--ns));font-weight:500;}
  .nm-t-row.lv2 .nm-t-txt{font-size:calc(15.5px * var(--ns));font-weight:500;}
  .nm-t-gl{display:block;margin-top:2px;font-family:var(--font-body);
    font-size:calc(11.5px * var(--ns));line-height:1.45;color:var(--muted);}
  /* 层级只靠缩进 + 左侧细线；手写不画 ├ └，屏幕也不再印树形符 */
  .nm-t-row.lv1 .nm-t-body,.nm-t-row.lv2 .nm-t-body{
    border-left:1px solid rgba(185,138,40,.24);padding-left:10px;}
  .nm-t-row.lv2 .nm-t-body{border-left-color:rgba(185,138,40,.15);}
  .nm-t-br.is-plain{opacity:0;}
  .nm-ntree-dot{display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--accent);vertical-align:middle;}

  .nm-m-note{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;
    margin-top:11px;padding-top:11px;border-top:1px solid var(--rule);scrollbar-width:thin;}
  /* 笔记还有下半截没露出时，底边淡出，提示可以继续往下看 */
  .nm-m-note.more{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent);
    mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent);}
  /* 选段后方法名退场，把整块高度让给笔记与原文 */
  .nm-margin.sec-on .nm-m-head{display:none;}
  .nm-margin.sec-on .nm-m-note{margin-top:10px;padding-top:0;border-top:0;}

  .nm-n-kicker{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);}
  .nm-n-kicker .r{flex:1;height:1px;background:var(--rule);}

  .nm-n-in{animation:nmFade .28s cubic-bezier(.22,.61,.25,1);}
  @keyframes nmFade{from{opacity:.2;transform:translateY(7px);}to{opacity:1;transform:none;}}
  .nm-n-name{font-family:var(--font-display);font-size:calc(26px * var(--ns));font-weight:600;letter-spacing:-.01em;
    margin:7px 0 0;line-height:1.15;}
  .nm-n-role{margin-top:3px;font-size:calc(11.5px * var(--ns));font-weight:600;letter-spacing:.05em;color:var(--accent);}
  .nm-n-drill{margin-top:9px;padding-left:9px;border-left:2px solid var(--accent);
    font-size:calc(13px * var(--ns));line-height:1.65;color:var(--ink-2);}
  .nm-n-drill b{display:block;font-size:calc(9.5px * var(--ns));letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent);margin-bottom:2px;}
  .nm-n-cap{margin:9px 0 3px;font-size:calc(10px * var(--ns));letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .nm-n-cap:first-of-type{margin-top:9px;}
  .nm-n-why{margin:0;font-size:calc(13px * var(--ns));line-height:1.75;color:var(--ink-2);}
  /* 段号条：骨架 · 1–6，一点即换段 */
  .nm-secnav{display:flex;align-items:center;gap:2px;flex:0 0 auto;margin-top:9px;padding-top:8px;
    border-top:1px solid var(--rule);}
  .nm-secnav button{border:0;background:none;font:inherit;font-size:13.5px;font-weight:600;
    color:var(--muted);min-width:27px;height:27px;padding:0 4px;border-radius:6px;cursor:pointer;
    transition:background .15s,color .15s;}
  .nm-secnav button:hover{background:var(--surface-2);color:var(--ink);}
  .nm-secnav button.on{background:var(--accent-bg);color:var(--accent);}
  .nm-secnav .sk{width:auto;padding:0 8px;color:var(--ink-2);}
  .nm-secnav .sk.on{color:var(--accent);}
  .nm-secnav .r{flex:1;height:1px;background:var(--rule);margin:0 4px;}

  .nm-m-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;
    padding-top:8px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--muted);letter-spacing:.02em;}
  .nm-m-foot span:last-child{font-family:var(--font-display);}

  /* ===== 纸面正文（下方三节） ===== */
  .nm-main{max-width:1020px;margin:0 auto;padding:30px 24px 110px;}
  .nm-sec{background:var(--paper);border:1px solid var(--rule);border-radius:3px;
    padding:30px 36px 28px;margin-top:26px;box-shadow:0 1px 2px rgba(43,42,38,.04);
    scroll-margin-top:24px;}
  .nm-sec:first-child{margin-top:0;}
  .nm-sechead{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;}
  .nm-stepno{font-family:var(--font-display);font-size:26px;line-height:1.15;color:var(--accent);flex:none;}
  .nm-h2{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:-.01em;margin:0 0 5px;}
  .nm-sub{margin:0;font-size:15.5px;line-height:1.75;color:var(--muted);max-width:62ch;}
  .nm-lead{font-size:17px;line-height:1.85;color:var(--ink-2);margin:0 0 16px;}
  .nm-h3{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:21px;
    font-weight:600;margin:24px 0 11px;}
  .nm-h3::before{content:'';width:3px;height:14px;background:var(--accent);}
  .nm-note{font-size:14px;color:var(--muted);line-height:1.65;margin:10px 0 0;}

  /* 键值行 */
  .nm-kv{display:flex;flex-direction:column;}
  .nm-kv-row{display:flex;gap:14px;padding:10px 2px;border-bottom:1px solid var(--rule);
    font-size:16.5px;line-height:1.7;}
  .nm-kv-row:last-child{border-bottom:0;}
  .nm-kv-k{flex:0 0 108px;font-weight:700;color:var(--ink);}
  .nm-kv-v{flex:1 1 auto;min-width:0;color:var(--ink-2);}
  .nm-kv-ex{display:block;margin-top:3px;font-family:var(--font-note);font-size:14.5px;color:var(--accent);}

  /* 表格 */
  .nm-table{width:100%;border-collapse:collapse;font-size:16.5px;}
  .nm-table th,.nm-table td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top;}
  .nm-table th{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;
    text-transform:uppercase;background:#f5f1e6;}
  .nm-table tr:last-child td{border-bottom:0;}
  .nm-table .nm-sym{font-family:var(--font-note);font-size:20px;font-weight:700;color:var(--accent);white-space:nowrap;}
  .nm-table .nm-exm{font-family:var(--font-note);font-size:15.5px;color:var(--ink-2);}
  .nm-table-wrap{border:1px solid var(--rule);border-radius:4px;overflow:hidden;overflow-x:auto;}

  /* 笔记行 */
  .nm-notes{display:flex;flex-direction:column;gap:1px;padding:13px 15px;
    border:1px solid var(--rule);border-radius:4px;background:#fff;}
  .nm-nline{display:flex;align-items:baseline;gap:9px;padding:3px 0;font-size:16.5px;}
  .nm-nline.lv1{padding-left:22px;}
  .nm-nline.lv2{padding-left:44px;}
  .nm-ntree{flex:0 0 16px;font-family:var(--font-note);font-size:13.5px;color:var(--muted);}
  .nm-ntxt{flex:1 1 auto;min-width:0;font-family:var(--font-note);font-size:16px;font-weight:600;color:var(--ink);}
  .nm-ngloss{display:none;}
  .nm-m-note .nm-notes{padding:9px 11px;}
  .nm-m-note .nm-nline{padding:3px 0;gap:7px;align-items:flex-start;}
  .nm-m-note .nm-ntree{flex:0 0 12px;font-size:12px;}
  .nm-m-note .nm-ntxt{font-size:15.5px;line-height:1.55;}
  .nm-m-note .nm-nline.lv1{padding-left:13px;}
  .nm-m-note .nm-nline.lv2{padding-left:26px;}
  .nm-nline.lv1 .nm-ntxt,.nm-nline.lv2 .nm-ntxt{
    border-left:1px solid rgba(185,138,40,.24);padding-left:9px;}

  /* U3 成品笔记 */
  .nm-pairs{display:flex;flex-direction:column;gap:14px;}
  .nm-pair{border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:#fff;}
  .nm-pair-head{display:flex;align-items:center;gap:10px;padding:10px 16px;
    background:#f5f1e6;border-bottom:1px solid var(--rule);}
  .nm-pair-name{font-family:var(--font-display);font-size:18.5px;font-weight:600;}
  .nm-pair-role{font-size:13.5px;color:var(--muted);}
  .nm-pair-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  .nm-pair-col{padding:13px 16px;min-width:0;}
  .nm-pair-col + .nm-pair-col{border-left:1px solid var(--rule);}

  /* 折叠块 */
  .nm-more{border-top:1px dashed var(--rule);padding:0;margin-top:14px;background:none;border-radius:0;}
  .nm-more summary{list-style:none;cursor:pointer;padding:8px 0;font-size:15.5px;font-weight:600;color:var(--accent);}
  .nm-more summary::-webkit-details-marker{display:none;}
  .nm-more summary::before{content:'＋ ';font-size:14px;color:var(--muted);}
  .nm-more[open] summary::before{content:'− ';}
  .nm-more p{margin:0 0 10px;font-size:16px;line-height:1.7;color:var(--ink-2);}
  .nm-more p.en{font-family:var(--font-display);}

  .nm-steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:9px;
    font-size:16.5px;line-height:1.75;color:var(--ink-2);}
  .nm-callout{padding:13px 16px;border:1px solid var(--rule);border-radius:4px;
    background:var(--amber-bg);color:var(--ink-2);font-size:16px;line-height:1.75;}
  .nm-callout b{color:var(--ink);}

  /* 方法依据：页尾折叠，只给老师查证 */
  .nm-refs{margin-top:26px;padding:0 36px;background:var(--paper);
    border:1px solid var(--rule);border-radius:3px;box-shadow:0 1px 2px rgba(43,42,38,.04);
    scroll-margin-top:24px;}
  .nm-refs[open]{padding-bottom:26px;}
  .nm-refs>summary{cursor:pointer;padding:18px 0;font-size:13px;font-weight:700;
    letter-spacing:.14em;color:var(--muted);list-style:none;}
  .nm-refs>summary::-webkit-details-marker{display:none;}
  .nm-refs>summary::before{content:'▸';display:inline-block;margin-right:8px;transition:transform .2s;}
  .nm-refs[open]>summary::before{transform:rotate(90deg);}
  .nm-refs>summary:hover{color:var(--accent);}
  .nm-refs-tag{margin:0 0 8px;font-size:13.5px;color:var(--muted);}
  .nm-refs-lead{margin:7px 0 9px;font-size:15px;line-height:1.7;color:var(--ink-2);}
  .nm-refs-list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px;
    font-size:15px;line-height:1.7;color:var(--ink-2);}
  .nm-refs-list a{color:var(--ink-2);text-decoration:none;border-bottom:1px dotted var(--rule);}
  .nm-refs-list a:hover{color:var(--accent);border-bottom-color:var(--accent);}
  .nm-refs-map{font-size:14.5px;}
  .nm-refs-note{margin:10px 0 0;font-size:14.5px;line-height:1.7;color:var(--muted);}
  .nm-empty{padding:20px;border:1px dashed var(--rule);border-radius:4px;
    color:var(--muted);font-size:16px;text-align:center;background:#fff;}
  .nm-hint{padding:20px;border:1px dashed var(--rule);border-radius:4px;color:var(--muted);
    font-size:16px;text-align:center;background:#fff;}

  @media (max-width:1180px){
    .nm-book{grid-template-columns:minmax(0,1fr) clamp(360px,36vw,420px);}
    .nm-margin{padding:16px 20px 12px;}
  }
  /* 大屏再放大一档：投影/一体机后排也能看清骨架 */
  @media (min-width:1700px){
    .nm-map-name{font-size:28px;}
    .nm-map-root-txt{font-size:34px;}
    .nm-t-txt{font-size:26px;}
    .nm-t-row.lv1 .nm-t-txt{font-size:24px;}
    .nm-t-row.lv2 .nm-t-txt{font-size:22px;}
  }
  @media (max-width:820px){
    .nm-guide{height:auto;padding:8px 10px;gap:6px;}
    .nm-guide-cap{display:none;}
    .nm-guide-top{flex-wrap:nowrap;overflow-x:auto;gap:5px;}
    .nm-cue{font-size:12px;padding:4px 7px;gap:4px;}
    .nm-cue b{font-size:12px;}
    .nm-guide-say{white-space:normal;overflow:visible;font-size:13px;line-height:1.55;}
    .nm-book{grid-template-columns:1fr;grid-template-rows:56dvh auto;height:auto;}
    .nm-view{height:56dvh;}
    .nm-margin{border-left:0;border-top:1px solid var(--rule);max-height:none;}
    /* 手机上页边跟着页面整体滚动：骨架与笔记都完整展开，不再各自截断 */
    .nm-m-note{max-height:none;}
    .nm-pair-body{grid-template-columns:1fr;}
    .nm-pair-col + .nm-pair-col{border-left:0;border-top:1px solid var(--rule);}
    .nm-main{padding:20px 14px 100px;}
    .nm-sec{padding:22px 18px 20px;}
    .nm-refs{padding:0 18px;}
    .nm-refs[open]{padding-bottom:20px;}
    .nm-book{height:auto;}
  }
</style>
