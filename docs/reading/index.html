<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seeklume · Reading Class 阅读课</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Caveat:wght@400;600&display=swap');

  :root {
    --bg:#f5f5f7; --surface:#ffffff; --surface-2:#fafafa; --surface-3:#f0f0f2;
    --border:#e5e5ea; --text:#1d1d1f; --text-2:#6e6e73; --text-3:#aeaeb2;
    --accent:#0071e3; --accent-bg:#f0f7ff; --purple:#af52de; --purple-bg:#f6edfb;
    --green:#34c759; --green-bg:#e8f8ed; --coral:#ff6b5e; --coral-bg:#fff0ee;
    --radius:12px;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.04);
    --shadow-lg:0 8px 26px rgba(0,0,0,.10),0 0 0 1px rgba(0,0,0,.04);
    --font-display:'Instrument Serif','Times New Roman',Georgia,serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  }
  [data-theme="dark"] {
    --bg:#1c1c1e; --surface:#2c2c2e; --surface-2:#3a3a3c; --surface-3:#48484a;
    --border:#38383a; --text:#f5f5f7; --text-2:#98989d; --text-3:#636366;
    --accent:#409cff; --accent-bg:rgba(64,156,255,.15); --purple:#c07af0; --purple-bg:rgba(192,122,240,.15);
    --green:#30d158; --green-bg:rgba(48,209,88,.15); --coral:#ff8a80; --coral-bg:rgba(255,138,128,.15);
    --shadow:0 1px 3px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.06);
    --shadow-lg:0 8px 26px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;font-family:var(--font-body);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;}

  body > header{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);}
  .back-link{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--accent);font-size:14px;font-weight:500;}
  .back-link:hover{opacity:.7;}
  .logo-text{font-family:var(--font-display);font-size:19px;letter-spacing:.02em;}
  .theme-toggle{background:var(--surface-2);border:1px solid var(--border);cursor:pointer;font-size:14px;padding:4px 10px;border-radius:6px;color:var(--text-2);}
  .theme-toggle:hover{background:var(--surface-3);}
  .theme-toggle .icon-sun{display:none;}
  [data-theme="dark"] .theme-toggle .icon-sun{display:inline;}
  [data-theme="dark"] .theme-toggle .icon-moon{display:none;}

  main{max-width:1000px;margin:0 auto;padding:30px 24px 120px;}

  /* ===== Hero ===== */
  .rc-hero{text-align:center;margin-bottom:26px;}
  .rc-hero-tag{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px;}
  .rc-hero-title{font-family:var(--font-display);font-size:44px;font-weight:400;margin:0 0 6px;line-height:1.1;}
  .rc-hero-sub{font-size:13px;color:var(--text-3);}

  /* ===== 装饰墙 ===== */
  .rc-wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:16px;}
  .rc-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;
    padding:18px;border-radius:16px;border:1px solid var(--border);background:var(--surface);
    cursor:pointer;text-align:left;font:inherit;transition:transform .2s,box-shadow .2s,border-color .2s;box-shadow:var(--shadow);}
  .rc-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
  .rc-tile.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow-lg);}
  .rc-tile-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:2px;}
  .rc-tile-label{font-size:16px;font-weight:700;}
  .rc-tile-sub{font-size:12px;color:var(--text-3);line-height:1.4;}
  .rc-tile-arrow{position:absolute;right:16px;top:20px;color:var(--text-3);font-size:15px;transition:transform .2s;}
  .rc-tile.active .rc-tile-arrow{transform:rotate(90deg);color:var(--accent);}
  .tone-ink  .rc-tile-ico{background:var(--surface-3);}
  .tone-blue .rc-tile-ico{background:var(--accent-bg);color:var(--accent);}
  .tone-coral .rc-tile-ico{background:var(--coral-bg);}
  .tone-purple .rc-tile-ico{background:var(--purple-bg);}
  .tone-green .rc-tile-ico{background:var(--green-bg);}

  /* ===== 面板 ===== */
  .rc-panels{margin-top:22px;}
  .rc-hint,.rc-empty{padding:22px;border:1px dashed var(--border);border-radius:16px;color:var(--text-3);font-size:13px;text-align:center;background:var(--surface-2);}
  .rc-panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:26px;box-shadow:var(--shadow);animation:panelIn .32s cubic-bezier(.16,1,.3,1);}
  @keyframes panelIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  .rc-panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .rc-panel-head h2{font-family:var(--font-display);font-size:26px;font-weight:400;margin:0;}
  .rc-kicker{font-size:11px;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;}
  .rc-h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:22px 0 10px;}
  .rc-lead{font-size:14px;color:var(--text-2);line-height:1.7;margin:0 0 16px;}
  .rc-note{font-size:12px;color:var(--text-3);line-height:1.6;margin:14px 0 0;}

  /* 理解面板 · 问题链 */
  .rc-idea-top{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;}
  .rc-meta-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2);margin-bottom:12px;}
  .rc-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--surface-3);color:var(--text-2);}
  .rc-h3-no{width:24px;height:24px;border-radius:8px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rc-h3-role{font-size:12px;font-weight:400;color:var(--text-3);}
  .rc-q-list{display:flex;flex-direction:column;gap:8px;}
  .rc-q{border:1px solid var(--border);border-radius:11px;background:var(--surface);overflow:hidden;}
  .rc-q summary{list-style:none;cursor:pointer;position:relative;padding:11px 34px 11px 14px;font-size:13.5px;font-weight:600;line-height:1.5;}
  .rc-q summary::-webkit-details-marker{display:none;}
  .rc-q summary::after{content:'+';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:16px;font-weight:400;color:var(--text-3);}
  .rc-q[open] summary::after{content:'−';}
  .rc-q summary:hover{background:var(--surface-2);}
  .rc-q[open] summary{color:var(--accent);}
  .rc-q p{margin:0;padding:0 14px 13px;font-size:13px;color:var(--text-2);line-height:1.7;}
  .rc-q-main{margin-top:20px;border-style:dashed;}

  /* 原文面板 · 可交互原书图 */
  .rc-reader{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:22px;}
  .rc-viewer{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:14px;background:var(--surface-3);aspect-ratio:1241 / 1754;cursor:grab;}
  .rc-viewer.grabbing{cursor:grabbing;}
  .rc-viewer-stage{position:absolute;inset:0;transform-origin:0 0;will-change:transform;}
  .rc-page-img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;}
  .rc-hot{position:absolute;border:2px solid transparent;background:rgba(0,122,255,.10);border-radius:8px;cursor:pointer;padding:0;font:inherit;transition:background .2s,border-color .2s;}
  .rc-hot:hover{background:rgba(0,122,255,.22);border-color:rgba(0,122,255,.6);}
  .rc-hot.active{background:rgba(0,122,255,.26);border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,122,255,.22);}
  /* 图上编号：贴在热区左上角外侧，永远不压印刷文字 */
  .rc-hot-no{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;
    background:rgba(0,113,227,.82);box-shadow:0 0 0 2px rgba(255,255,255,.9);transition:background .2s,box-shadow .2s;}
  .rc-hot.active .rc-hot-no{background:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.3);}
  .rc-viewer-tools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3;}
  .rc-viewer-tools button{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;font-size:15px;line-height:1;box-shadow:var(--shadow);}
  .rc-viewer-tools button:hover{background:var(--surface-3);}
  .rc-reader-side{display:flex;flex-direction:column;gap:14px;min-width:0;}
  .rc-sec-list{display:flex;flex-direction:column;gap:8px;}
  .rc-sec-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font:inherit;text-align:left;transition:all .2s;}
  .rc-sec-btn:hover{border-color:var(--accent);}
  .rc-sec-btn.active{border-color:var(--accent);background:var(--accent-bg);}
  .rc-sec-no{width:22px;height:22px;border-radius:7px;background:var(--surface-3);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0;}
  .rc-sec-btn.active .rc-sec-no{background:var(--accent);color:#fff;}
  .rc-sec-txt{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .rc-sec-name{font-size:13.5px;font-weight:700;}
  .rc-sec-role{font-size:11px;color:var(--text-3);}
  .rc-sec-detail{border-top:1px solid var(--border);padding-top:14px;}
  .rc-detail-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .rc-detail-no{width:22px;height:22px;border-radius:7px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .rc-detail-name{font-size:15px;font-weight:700;}
  .rc-detail-role{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:8px;}
  .rc-detail-para{font-size:12.5px;line-height:1.65;color:var(--text-2);font-family:Georgia,'Times New Roman',serif;margin:0 0 12px;}
  .rc-detail-shot{margin:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface-2);}
  .rc-detail-shot img{width:100%;display:block;}
  .rc-detail-shot figcaption{font-size:10.5px;color:var(--text-3);padding:6px 10px;border-top:1px solid var(--border);}

  /* 结构面板：骨架导航 + 导图 / 笔记两种摆法 */
  .rc-spine{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px;}
  .rc-spine-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
  .rc-spine-chip:hover{border-color:var(--accent);}
  .rc-spine-chip.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);}
  .rc-spine-no{width:18px;height:18px;border-radius:6px;background:var(--surface-3);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--text-2);}
  .rc-spine-chip.active .rc-spine-no{background:var(--accent);color:#fff;}

  .rc-view-switch{display:inline-flex;gap:2px;padding:3px;margin-bottom:14px;border-radius:10px;background:var(--surface-3);}
  .rc-view-switch button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--text-2);padding:6px 18px;border-radius:8px;cursor:pointer;transition:all .2s;}
  .rc-view-switch button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}

  .rc-struct-head{display:flex;align-items:center;gap:9px;padding-bottom:12px;margin-bottom:10px;border-bottom:1px solid var(--border);}
  .rc-struct-no{width:22px;height:22px;border-radius:7px;background:var(--surface-3);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0;}
  .rc-struct-name{font-size:15px;font-weight:700;}
  .rc-struct-role{font-size:12px;color:var(--text-3);}
  .rc-struct-view{margin-left:auto;font-size:11px;color:var(--text-3);letter-spacing:.06em;}
  .rc-map{padding:4px 8px;}

  .rc-notes{display:flex;flex-direction:column;gap:20px;}
  .rc-notes-sec-head{display:flex;align-items:center;gap:9px;margin-bottom:4px;}
  .rc-notes-no{width:20px;height:20px;border-radius:6px;background:var(--surface-3);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0;}
  .rc-notes-name{font-size:13.5px;font-weight:700;}
  .rc-notes-role{font-size:11px;color:var(--text-3);}
  .rc-note-line{display:flex;align-items:baseline;gap:10px;padding:7px 4px;border-bottom:1px solid var(--border);}
  .rc-note-line:last-child{border-bottom:0;}
  .rc-note-line.lv1{padding-left:30px;}
  .rc-note-tree{flex:0 0 16px;font-size:13px;color:var(--text-3);}
  .rc-note-txt{flex:1 1 auto;min-width:0;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:600;color:var(--text);}
  .rc-note-gloss{flex:0 1 40%;font-size:12px;color:var(--text-3);text-align:right;}

  /* 背诵面板 */
  .rc-quote-list{display:grid;gap:12px;}
  .rc-quote{margin:0;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 12px 12px 0;padding:14px 18px;}
  .rc-quote-en{font-family:var(--font-display);font-size:17px;margin:0 0 6px;line-height:1.5;}
  .rc-quote-zh{font-size:13px;color:var(--text-3);margin:0;}
  .rc-phrase-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;}
  .rc-phrase{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);}
  .rc-phrase-en{font-weight:600;font-size:14px;color:var(--accent);}
  .rc-phrase-zh{font-size:12px;color:var(--text-3);}
  .rc-hintline{margin:20px 0 16px;padding:12px 16px;border-radius:12px;background:var(--green-bg);color:var(--text-2);font-size:13px;line-height:1.6;}

  /* ===== 上课模式（lesson.js）· 原文当舞台，内容浮在原文上 ===== */
  html.ls-on,html.ls-on body{overflow:hidden;}
  html.ls-on body > header,html.ls-on main,html.ls-on #skDock{display:none !important;}

  .ls-deck{position:fixed;inset:0;z-index:9000;display:grid;grid-template-columns:118px minmax(0,1fr);
    background:var(--bg);color:var(--text);font-size:16px;}
  .ls-deck[hidden]{display:none !important;}
  .ls-rail{display:flex;flex-direction:column;gap:5px;padding:16px 10px;overflow:auto;
    border-right:1px solid var(--border);background:var(--surface);}
  .ls-rail-item{display:flex;flex-direction:column;gap:1px;padding:9px 10px;border-radius:10px;border:1px solid transparent;
    background:transparent;font:inherit;text-align:left;color:var(--text-2);cursor:pointer;}
  .ls-rail-item:hover{background:var(--surface-3);}
  .ls-rail-item.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);}
  .ls-rail-label{font-size:12.5px;font-weight:600;line-height:1.3;}

  .ls-main{position:relative;display:grid;grid-template-rows:minmax(0,1fr) 58px;min-width:0;min-height:0;}
  .ls-stage{position:relative;min-width:0;min-height:0;padding:0;overflow:hidden;}
  .ls-foot{display:flex;align-items:center;gap:12px;padding:0 24px;border-top:1px solid var(--border);background:var(--surface);}
  .ls-nav{width:40px;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);
    font-size:18px;line-height:1;color:var(--text-2);cursor:pointer;}
  .ls-nav:hover:not(:disabled){background:var(--surface-3);}
  .ls-nav:disabled{opacity:.35;cursor:default;}
  .ls-count{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums;}
  .ls-keys{display:none;margin-left:auto;font-size:12px;color:var(--text-3);}
  @media (min-width:1200px){.ls-keys{display:block;}}
  .ls-exit{padding:9px 16px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);
    font:inherit;font-size:13px;color:var(--text-2);cursor:pointer;}
  .ls-exit:hover{background:var(--surface-3);}

  .ls-v{position:absolute;inset:0;min-height:0;pointer-events:none;}
  .ls-v .ls-plate{pointer-events:auto;}

  /* ── 舞台：原书整页铺满，镜头可推拉 ── */
  .ls-scene{position:absolute;inset:0;overflow:hidden;background:var(--surface-3);}
  .ls-figure{position:absolute;inset:0;overflow:hidden;}
  .ls-figstage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;
    transition:transform .78s cubic-bezier(.22,.61,.25,1);}
  .ls-figstage.dragging{transition:none;}
  .ls-pagebox{position:absolute;left:0;top:0;}
  .ls-page{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;
    background:#fff;border-radius:5px;box-shadow:0 22px 64px rgba(0,0,0,.26),0 2px 8px rgba(0,0,0,.10);}
  /* 背景态：原文留在后面当肌理，不抢内容 */
  .ls-scene.tint-soft .ls-page{opacity:.62;}
  .ls-scene.tint-soft .ls-figure::after{content:'';position:absolute;inset:0;background:var(--bg);opacity:.3;}
  .ls-scene.tint-hard .ls-page{opacity:.28;filter:blur(2px);}
  .ls-scene.tint-hard .ls-figure::after{content:'';position:absolute;inset:0;background:var(--bg);opacity:.5;}
  .ls-scene.full .ls-page{opacity:1;}
  .ls-scene .ls-figure{cursor:grab;}
  .ls-scene .ls-figure.dragging{cursor:grabbing;}

  .ls-hots{position:absolute;inset:0;}
  .ls-hotbox{position:absolute;border:2px dashed rgba(0,113,227,.0);background:transparent;
    border-radius:9px;padding:0;cursor:pointer;transition:background .25s,border-color .25s,opacity .3s;
    opacity:.34;}
  .ls-hotbox:hover{background:rgba(0,113,227,.10);border-color:rgba(0,113,227,.55);opacity:1;}
  .ls-hotbox.on{background:rgba(0,113,227,.12);border:2px solid rgba(0,113,227,.75);opacity:1;
    box-shadow:0 0 0 3px rgba(0,113,227,.12);}
  .ls-hotbox::after{content:attr(data-mark);position:absolute;left:0;top:50%;transform:translate(calc(-100% - 6px),-50%);
    width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;
    font-family:var(--font-body);
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff;}
  .ls-hots:not(.lit) .ls-hotbox{opacity:0;}
  .ls-hots:not(.lit) .ls-hotbox:hover{opacity:.9;}

  /* ── 右侧玻璃浮层：内容压在原图上，图始终露着 ── */
  .ls-plate{position:absolute;top:14px;right:14px;bottom:14px;width:var(--panel-w,44%);
    display:flex;flex-direction:column;gap:10px;min-height:0;padding:15px;overflow:hidden;
    border-radius:20px;border:1px solid color-mix(in srgb,var(--border) 78%,transparent);
    background:color-mix(in srgb,var(--surface) 86%,transparent);
    -webkit-backdrop-filter:blur(22px) saturate(1.25);backdrop-filter:blur(22px) saturate(1.25);
    box-shadow:0 26px 70px rgba(0,0,0,.18);}
  /* 居中态：拼回去 / 作业 —— 原文从四周露出来当舞台 */
  .ls-plate.center{left:50%;right:auto;top:50%;bottom:auto;width:min(1200px,88%);
    transform:translate(-50%,-50%);height:calc(100% - 28px);}
  /* 浮动态：读前 / 认门 —— 高度随内容，右侧让出原文 */
  .ls-plate.float{top:50%;bottom:auto;transform:translateY(-50%);height:auto;max-height:calc(100% - 28px);}
  .ls-plate-head{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
  .ls-plate-head h2{font-family:var(--font-display);font-size:30px;font-weight:400;margin:0;line-height:1.12;}
  .ls-kicker{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;}
  .ls-lead{font-size:15px;line-height:1.65;color:var(--text-2);margin:0;}
  .ls-empty{font-size:15px;line-height:1.7;color:var(--text-3);margin:8px 0;}

  /* 读前浮层：悬在中间时给足高度，别塌成一小条 */
  .ls-plate.float .ls-plate-head h2{font-size:36px;}
  .ls-plate.float .ls-plate-head{gap:7px;margin-bottom:4px;}
  .ls-plate.float .ls-qgrid{flex:0 0 auto;gap:11px;}

  /* 段落标牌：浮在原文左上，不遮正文 */
  .ls-scene-head{position:absolute;left:18px;top:16px;display:flex;align-items:center;gap:10px;
    max-width:44%;padding:9px 14px 9px 9px;border-radius:14px;
    border:1px solid color-mix(in srgb,var(--border) 78%,transparent);
    background:color-mix(in srgb,var(--surface) 86%,transparent);
    -webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
    box-shadow:0 10px 30px rgba(0,0,0,.12);}
  .ls-sec-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;}
  .ls-sec-txt{display:flex;flex-direction:column;min-width:0;}
  .ls-sec-name{font-family:var(--font-display);font-size:22px;line-height:1.15;white-space:nowrap;}
  .ls-sec-role{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* 镜头工具条（在底栏里，不压原文） */
  .ls-cam{display:flex;align-items:center;gap:3px;padding:3px;border-radius:11px;
    border:1px solid var(--border);background:var(--surface-2);}
  .ls-cam button{min-width:34px;height:30px;padding:0 10px;border:0;border-radius:8px;background:transparent;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--text-2);cursor:pointer;}
  .ls-cam button:hover:not(:disabled){background:var(--surface-3);}
  .ls-cam button:disabled{opacity:.35;cursor:default;}
  .ls-cam button.on{background:var(--accent);color:#fff;}
  .ls-cam-z{min-width:44px;text-align:center;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;}
  .ls-cam-sep{width:1px;height:18px;background:var(--border);margin:0 3px;}

  /* 四层折叠：一屏只掀一层，其余收成条（可回看 / 待掀开）*/
  .ls-layers{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden;flex:1 1 auto;}
  .ls-layer{display:flex;flex-direction:column;min-height:0;border:1px solid var(--border);border-radius:13px;
    background:color-mix(in srgb,var(--surface) 92%,transparent);box-shadow:var(--shadow);}
  .ls-layer.open{flex:1 1 0;min-height:0;}
  .ls-layer.locked{opacity:.55;}
  .ls-layer-head{display:flex;align-items:center;gap:10px;padding:10px 13px;border:0;border-radius:13px;
    background:transparent;font:inherit;text-align:left;cursor:pointer;flex-shrink:0;}
  .ls-layer-head:hover{background:var(--surface-2);}
  .ls-layer-no{width:21px;height:21px;border-radius:7px;background:var(--surface-3);font-size:11.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0;}
  .ls-layer.open .ls-layer-no{background:var(--accent);color:#fff;}
  .ls-layer-name{font-size:17px;font-weight:700;}
  .ls-layer-en{font-size:10.5px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase;}
  .ls-layer-hint{font-size:12px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ls-layer-state{margin-left:auto;font-size:11.5px;color:var(--text-3);white-space:nowrap;flex-shrink:0;}
  .ls-layer.open .ls-layer-state{color:var(--accent);font-weight:600;}
  .ls-layer-body{display:none;padding:0 13px 13px;min-height:0;overflow:auto;}
  .ls-layer.open .ls-layer-body{display:flex;flex-direction:column;flex:1 1 0;gap:9px;}

  /* 开场 */
  .ls-opening-cap{position:absolute;left:18px;top:16px;display:flex;flex-direction:column;gap:4px;
    padding:13px 20px 13px 17px;border-radius:16px;
    border:1px solid color-mix(in srgb,var(--border) 78%,transparent);
    background:color-mix(in srgb,var(--surface) 86%,transparent);
    -webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
    box-shadow:0 10px 30px rgba(0,0,0,.12);}
  .ls-cap-k{font-size:11px;color:var(--text-3);letter-spacing:.12em;text-transform:uppercase;}
  .ls-cap-t{font-family:var(--font-display);font-size:28px;line-height:1.1;}
  .ls-cap-h{font-size:12.5px;color:var(--text-3);}

  /* 问题卡 */
  .ls-qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;align-content:start;flex:1 1 auto;}
  .ls-q{display:flex;flex-direction:column;gap:5px;padding:12px 13px;border:1px solid var(--border);border-radius:14px;
    background:color-mix(in srgb,var(--surface) 92%,transparent);font:inherit;text-align:left;cursor:pointer;box-shadow:var(--shadow);}
  .ls-q:hover{border-color:var(--accent);}
  .ls-q-q{font-size:16px;font-weight:700;line-height:1.4;}
  .ls-q-a{display:none;font-size:15px;line-height:1.65;color:var(--text-2);}
  .ls-q.on .ls-q-a{display:block;}
  .ls-q-hint{font-size:11.5px;color:var(--text-3);}
  .ls-q.on .ls-q-hint{display:none;}

  /* 认门 · 五部件 */
  .ls-genre{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;flex:1 1 auto;min-height:0;align-content:center;}
  .ls-genre-card{display:flex;flex-direction:column;gap:6px;padding:15px;border:1px solid var(--border);
    border-radius:14px;background:color-mix(in srgb,var(--surface) 92%,transparent);box-shadow:var(--shadow);}
  .ls-genre-no{width:25px;height:25px;border-radius:8px;background:var(--accent-bg);color:var(--accent);
    font-weight:700;display:flex;align-items:center;justify-content:center;}
  .ls-genre-name{font-size:18px;font-weight:700;}
  .ls-genre-en{font-size:10.5px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase;}
  .ls-genre-role{font-size:12.5px;color:var(--accent);font-weight:600;}
  .ls-genre-text{font-family:Georgia,serif;font-size:13.5px;line-height:1.5;color:var(--text-2);}
  .ls-genre-note{margin-top:auto;font-size:12px;line-height:1.5;color:var(--text-3);}

  /* 构 · 小导图与骨架 */
  .ls-shape{display:flex;flex-direction:column;gap:8px;min-height:0;}
  .ls-shape-role,.ls-shape-gist{margin:0;font-size:14.5px;line-height:1.6;color:var(--text-2);}
  .ls-map{min-height:0;}
  .ls-map svg{height:100% !important;width:100%;}
  .ls-map-sm{flex:1 1 auto;min-height:150px;}

  /* 词 · 讲台上一屏一个词（正面只有挖空句，翻面才展开词根词缀）*/
  .ls-word{display:flex;flex-direction:column;gap:9px;min-height:0;flex:1 1 auto;}
  .ls-wstrip{display:flex;flex-wrap:wrap;gap:5px;flex-shrink:0;}
  .ls-wdot{width:24px;height:24px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
    color:var(--text-2);font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;line-height:1;
    display:flex;align-items:center;justify-content:center;}
  .ls-wdot:hover{border-color:var(--accent);color:var(--accent);}
  .ls-wdot.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .ls-wcard{position:relative;flex:1 1 auto;min-height:210px;display:flex;flex-direction:column;gap:8px;
    padding:18px 20px;border:1px solid var(--border);border-radius:16px;font:inherit;text-align:left;cursor:pointer;
    background:color-mix(in srgb,var(--surface) 94%,transparent);box-shadow:var(--shadow);}
  .ls-wcard.core{border-color:rgba(0,113,227,.4);box-shadow:0 0 0 1px rgba(0,113,227,.14),var(--shadow);}
  .ls-wcard .ls-card-front{display:flex;flex-direction:column;gap:10px;height:100%;}
  .ls-card-mid{display:flex;flex-direction:column;gap:12px;margin:auto 0;min-height:0;}
  .ls-wcard .ls-wsent{font-size:21px;line-height:1.62;}
  .ls-whint{margin:0;font-size:12.5px;font-weight:600;color:var(--text-3);letter-spacing:.02em;}
  .ls-whint b{color:var(--accent);font-family:Georgia,serif;font-size:15px;}
  .ls-wcard.flip .ls-card-front{display:none;}
  .ls-wcard .ls-card-back{display:none;}
  .ls-wcard.flip .ls-card-back{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;}
  .ls-wsent{font-family:Georgia,serif;font-size:19px;line-height:1.6;color:var(--text);margin:0;}
  .ls-wbig{font-family:var(--font-display);font-size:34px;line-height:1.1;}
  .ls-wfoot{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .ls-wnav{flex:1 1 0;padding:9px 12px;border:1px solid var(--border);border-radius:11px;background:var(--surface);
    color:var(--text-2);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
  .ls-wnav:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .ls-wnav:disabled{opacity:.4;cursor:default;}
  .ls-wpos{font-size:12px;color:var(--text-3);font-weight:600;white-space:nowrap;}

  /* 收束幕里的词卡网格（全篇总览用，不在讲台上逐个翻）*/
  .ls-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:8px;align-content:start;}
  .ls-card{position:relative;display:flex;flex-direction:column;min-height:146px;padding:11px 13px;
    border:1px solid var(--border);border-radius:13px;background:color-mix(in srgb,var(--surface) 94%,transparent);
    font:inherit;text-align:left;cursor:pointer;box-shadow:var(--shadow);}
  .ls-card.core{border-color:rgba(0,113,227,.4);box-shadow:0 0 0 1px rgba(0,113,227,.14),var(--shadow);}
  .ls-card-flag{position:absolute;right:11px;top:10px;font-size:10.5px;font-weight:700;color:var(--accent);
    background:var(--accent-bg);padding:1px 7px;border-radius:6px;}
  .ls-card-front{display:flex;flex-direction:column;gap:6px;}
  .ls-card.flip .ls-card-front{display:none;}
  .ls-card-back{display:none;}
  .ls-card.flip .ls-card-back{display:flex;flex-direction:column;gap:5px;}
  .ls-card-pos{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase;}
  .ls-card-sent{font-family:Georgia,serif;font-size:14.5px;line-height:1.5;color:var(--text);margin:2px 0 0;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .ls-card-tap{margin-top:auto;font-size:11.5px;color:var(--text-3);}
  .ls-card-head{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;}
  .ls-word{font-family:var(--font-display);font-size:22px;line-height:1.1;}
  .ls-ipa{font-size:12px;color:var(--text-3);}
  .ls-zh{font-size:13.5px;font-weight:600;color:var(--accent);}
  .ls-plate.wide{--panel-w:48%;}
  .ls-wcard.flip.scrollable::after{content:'';position:absolute;left:1px;right:1px;bottom:1px;height:30px;
    border-radius:0 0 15px 15px;pointer-events:none;
    background:linear-gradient(to top,color-mix(in srgb,var(--surface) 96%,transparent),transparent);}
  .ls-wcard{padding:15px 18px;gap:6px;}
  .ls-wcard .ls-card-back{gap:6px;}
  .ls-wcard .ls-wbig{font-size:30px;}
  .ls-wcard .ls-zh{font-size:16px;}
  .ls-wcard .ls-wrows{gap:5px;margin-top:1px;}
  .ls-wcard .ls-wrow{grid-template-columns:42px minmax(0,1fr);gap:7px;font-size:13.5px;line-height:1.45;}
  .ls-wcard .ls-wk{font-size:11.5px;padding-top:2px;}
  .ls-wcard .ls-kin{font-size:12px;margin-top:1px;}
  .ls-wcard .ls-src{font-size:11px;}
  .ls-wrows{display:flex;flex-direction:column;gap:4px;}
  .ls-wrow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:7px;font-size:12.5px;line-height:1.45;}
  .ls-wk{color:var(--text-3);font-weight:700;font-size:11px;padding-top:2px;}
  .ls-wv{color:var(--text-2);}
  .ls-kin{display:block;color:var(--text-3);font-style:normal;font-size:11.5px;}
  .ls-src{margin-top:auto;font-size:10.5px;color:var(--text-3);}

  /* 说 · 复述笔记 */
  .ls-say{display:flex;flex-direction:column;gap:9px;min-height:0;}
  .ls-notesbox{display:flex;flex-direction:column;gap:1px;padding:11px 13px;border-radius:12px;
    background:color-mix(in srgb,var(--surface-2) 92%,transparent);border:1px solid var(--border);}
  .ls-nline{display:flex;align-items:baseline;gap:7px;font-size:14px;line-height:1.5;}
  .ls-nline.lv1{padding-left:18px;}
  .ls-ntree{color:var(--text-3);font-family:var(--font-display);}
  .ls-ntxt{font-weight:600;}
  .ls-ngloss{font-size:12px;color:var(--text-3);}
  .ls-tr{border:1px solid var(--border);border-radius:10px;background:color-mix(in srgb,var(--surface) 92%,transparent);padding:0 12px;}
  .ls-tr summary{cursor:pointer;padding:9px 2px;font-size:12.5px;font-weight:600;color:var(--accent);}
  .ls-tr p{margin:0 0 11px;font-size:14px;line-height:1.7;color:var(--text-2);}

  /* 拼回去 */
  .ls-tabs{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-3);margin-bottom:14px;}
  .ls-tabs button{border:0;border-radius:9px;background:transparent;font:inherit;font-size:14px;font-weight:600;
    color:var(--text-2);padding:8px 18px;cursor:pointer;}
  .ls-tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
  .ls-rec-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  .ls-recscroll{min-height:0;overflow:auto;padding-right:6px;}
  .ls-rec-body>.ls-map{flex:1 1 auto;min-height:0;}
  .ls-nsec{margin-bottom:16px;}
  .ls-nsec-head{display:flex;align-items:baseline;gap:9px;margin-bottom:6px;}
  .ls-nsec-no{font-size:15px;color:var(--accent);font-weight:700;}
  .ls-nsec-name{font-size:16px;font-weight:700;}
  .ls-nsec-role{font-size:12.5px;color:var(--text-3);}
  .ls-cardgroup{margin-bottom:18px;}
  .ls-cg-head{font-size:13px;font-weight:700;color:var(--text-2);letter-spacing:.04em;margin-bottom:8px;}
  .ls-affix{width:100%;border-collapse:collapse;font-size:14.5px;}
  .ls-affix th,.ls-affix td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top;}
  .ls-affix th{font-size:12px;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;}
  .ls-affix .ls-af{font-family:var(--font-display);font-size:18px;color:var(--accent);white-space:nowrap;}
  .ls-affix .ls-ex{font-weight:600;}
  .ls-affix .ls-more{color:var(--text-3);font-size:13px;}
  .ls-affix-tip{margin:14px 0 0;font-size:13px;color:var(--text-3);}

  /* 作业 */
  .ls-hw{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}
  .ls-hw-col{display:flex;flex-direction:column;gap:10px;padding:18px;border:1px solid var(--border);
    border-radius:16px;background:var(--surface);box-shadow:var(--shadow);min-height:0;overflow:auto;}
  .ls-hw-scaf{background:var(--accent-bg);border-color:rgba(0,113,227,.3);}
  .ls-hw-title{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--text-2);}
  .ls-hw-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:15.5px;line-height:1.65;}
  .ls-hw-ups{display:flex;flex-direction:column;gap:12px;}
  .ls-hw-up{display:flex;flex-direction:column;gap:4px;}
  .ls-hw-tag{align-self:flex-start;font-size:12px;font-weight:700;color:#fff;background:var(--accent);
    padding:2px 9px;border-radius:6px;}
  .ls-hw-d{font-size:15px;line-height:1.65;color:var(--text-2);}
  .ls-hw-lines{display:flex;flex-direction:column;gap:8px;}
  .ls-hw-line{font-size:15px;line-height:1.6;color:var(--text);}
  .ls-hw-tip{margin:auto 0 0;font-size:12.5px;color:var(--text-3);line-height:1.6;}

  /* 装饰墙上的上课模式入口 */
  .rc-start{display:block;margin:0 auto 22px;padding:14px 28px;border-radius:999px;border:0;
    background:var(--accent);color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,113,227,.28);transition:transform .2s,box-shadow .2s;}
  .rc-start:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(0,113,227,.34);}
  .rc-method{display:flex;justify-content:center;margin:18px 0 0;}
  .rc-method a{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;
    border:1px solid var(--border);background:var(--surface);color:var(--text-2);text-decoration:none;
    font-size:12.5px;font-weight:600;box-shadow:var(--shadow);transition:all .2s;}
  .rc-method a:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-1px);}

  @media (max-width:720px){
    .rc-reader{grid-template-columns:1fr;}
    .rc-hero-title{font-size:34px;}
    main{padding:22px 16px 120px;}
    .ls-deck{grid-template-columns:1fr;}
    .ls-rail{display:none;}
    .ls-plate{left:12px;right:12px;top:auto;bottom:12px;width:auto;max-height:62%;}
    .ls-scene-head{max-width:calc(100% - 36px);}
    .ls-cam{bottom:auto;top:64px;}
    .ls-genre{grid-template-columns:1fr 1fr;}
    .ls-hw{grid-template-columns:1fr;overflow:auto;}
    .ls-stage{padding:0;}
    .ls-keys{display:none;}
  }
</style>

<script>
function toggleTheme(){
  var c = document.documentElement.getAttribute('data-theme');
  var n = c === 'dark' ? '' : 'dark';
  document.documentElement.setAttribute('data-theme', n);
  try { localStorage.setItem('theme', n === 'dark' ? 'dark' : 'light'); } catch(e){}
  window.dispatchEvent(new Event('rc-theme-change'));
}
try { if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch(e){}
</script>
