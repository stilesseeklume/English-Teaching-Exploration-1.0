<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seeklume · 跟读器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --bg: #061628; --bg-2: #0a2340;
    --surface: rgba(255,255,255,0.04); --surface-2: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.12); --border-strong: rgba(255,255,255,0.22);
    --text: #f5f7fa; --text-2: #9fb3c8; --text-3: #5a7390;
    --accent: #5fb0ff; --accent-2: #f5c451;
    --accent-bg: rgba(95,176,255,0.12); --accent-glow: rgba(95,176,255,0.35);
    --green: #4ade80; --red: #f87171;
    --font-display: 'Instrument Serif', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  }
  [data-theme="light"] {
    --bg: #f4f6f9; --bg-2: #e8edf4;
    --surface: rgba(255,255,255,0.85); --surface-2: #f0f3f8;
    --border: rgba(15,45,82,0.12); --border-strong: rgba(15,45,82,0.22);
    --text: #0f2440; --text-2: #4a6078; --text-3: #8a9bb0;
    --accent: #1a6fd8; --accent-2: #c9921e;
    --accent-bg: rgba(26,111,216,0.10); --accent-glow: rgba(26,111,216,0.22);
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:var(--font-body); color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  body::before { content:''; position:fixed; inset:0; z-index:-2; background:radial-gradient(ellipse 80% 60% at 15% 10%, rgba(95,176,255,0.18) 0%, transparent 55%), radial-gradient(ellipse 70% 50% at 85% 20%, rgba(245,196,81,0.10) 0%, transparent 50%), linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%); }
  header { position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; height:56px; padding:0 24px; background:rgba(6,22,40,0.72); backdrop-filter:blur(18px) saturate(160%); border-bottom:1px solid var(--border); }
  [data-theme="light"] header { background:rgba(244,246,249,0.82); }
  .back-link { display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--text-2); font-size:14px; transition:color .2s; }
  .back-link:hover { color:var(--accent); }
  .logo-text { font-family:var(--font-display); font-size:20px; color:var(--text); }
  .header-right { display:flex; align-items:center; gap:8px; }
  .theme-toggle { background:var(--surface); border:1px solid var(--border); cursor:pointer; font-size:15px; padding:6px 10px; border-radius:10px; color:var(--text-2); transition:all .2s; }
  .theme-toggle:hover { background:var(--surface-2); color:var(--text); }
  .theme-toggle .icon-sun { display:none; }
  [data-theme="light"] .theme-toggle .icon-sun { display:inline; }
  [data-theme="light"] .theme-toggle .icon-moon { display:none; }
  main { max-width:860px; margin:0 auto; padding:32px 24px 80px; }
  .lesson-info { text-align:center; margin-bottom:28px; }
  .lesson-info .eyebrow { font-size:11px; letter-spacing:0.22em; color:var(--accent); text-transform:uppercase; font-weight:500; margin-bottom:12px; }
  .lesson-info h1 { font-family:var(--font-display); font-size:clamp(32px,5vw,48px); font-weight:400; margin:0 0 8px; color:var(--text); }
  .lesson-info .subtitle { font-size:14px; color:var(--text-2); }
  .controls { display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; margin-bottom:24px; padding:16px 24px; background:var(--surface); backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:16px; }
  .control-group { display:flex; align-items:center; gap:8px; }
  .control-label { font-size:12px; color:var(--text-3); font-weight:500; text-transform:uppercase; letter-spacing:0.08em; }
  .speed-btn, .gap-btn { padding:6px 14px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--text-2); font:inherit; font-size:13px; cursor:pointer; transition:all .2s; }
  .speed-btn.active, .gap-btn.active { background:var(--accent-bg); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .speed-btn:hover, .gap-btn:hover { border-color:var(--border-strong); color:var(--text); }
  .btn-primary { padding:12px 32px; border-radius:999px; border:none; background:linear-gradient(135deg, var(--accent), #3a8ce0); color:#061628; font:inherit; font-size:15px; font-weight:600; cursor:pointer; box-shadow:0 4px 16px var(--accent-glow); transition:transform .15s, box-shadow .2s; }
  .btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 22px var(--accent-glow); }
  .btn-secondary { padding:10px 24px; border-radius:999px; border:1px solid var(--border-strong); background:var(--surface); color:var(--text); font:inherit; font-size:14px; cursor:pointer; transition:all .2s; }
  .btn-secondary:hover { background:var(--surface-2); }
  .progress-bar { height:4px; background:var(--surface); border-radius:999px; overflow:hidden; margin-bottom:28px; }
  .progress-fill { height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); width:0%; transition:width .4s ease; border-radius:999px; }
  .text-section { margin-bottom:32px; }
  .time-marker { display:inline-block; font-family:var(--font-display); font-size:22px; color:var(--accent); margin-bottom:12px; padding:2px 14px; background:var(--accent-bg); border-radius:8px; }
  .sentence-card { position:relative; padding:16px 20px 16px 52px; margin-bottom:8px; border-radius:14px; background:var(--surface); border:1px solid var(--border); transition:all .3s ease; cursor:pointer; }
  .sentence-card:hover { background:var(--surface-2); border-color:var(--border-strong); }
  .sentence-card.active { background:var(--accent-bg); border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 8px 24px var(--accent-glow); transform:translateX(4px); }
  .sentence-card.read { opacity:0.55; }
  .sentence-card.read .check-mark { opacity:1; }
  .check-mark { position:absolute; top:16px; right:16px; width:20px; height:20px; border-radius:50%; background:var(--green); opacity:0; transition:opacity .3s; display:flex; align-items:center; justify-content:center; font-size:11px; color:#061628; font-weight:700; }
  .sentence-num { position:absolute; left:16px; top:18px; width:28px; height:28px; border-radius:8px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:var(--text-3); transition:all .3s; }
  .sentence-card.active .sentence-num { background:var(--accent); color:#061628; }
  .sentence-en { font-size:16px; line-height:1.7; color:var(--text); margin:0 0 4px; }
  .sentence-zh { font-size:13px; line-height:1.6; color:var(--text-3); margin:0; display:none; }
  .show-translation .sentence-zh { display:block; }
  .countdown-overlay { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(120px); z-index:200; display:flex; flex-direction:column; align-items:center; gap:8px; padding:20px 40px; background:rgba(6,22,40,0.92); backdrop-filter:blur(20px) saturate(160%); border:1px solid var(--border-strong); border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.5); opacity:0; transition:transform .35s cubic-bezier(.16,1,.3,1), opacity .35s ease; pointer-events:none; }
  [data-theme="light"] .countdown-overlay { background:rgba(255,255,255,0.95); }
  .countdown-overlay.show { transform:translateX(-50%) translateY(0); opacity:1; }
  .countdown-label { font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); font-weight:500; }
  .countdown-number { font-family:var(--font-display); font-size:48px; font-weight:400; color:var(--text); line-height:1; }
  .countdown-hint { font-size:13px; color:var(--text-2); }
  .countdown-bar { width:120px; height:3px; background:var(--surface-2); border-radius:999px; overflow:hidden; }
  .countdown-bar-fill { height:100%; background:var(--accent); width:100%; transform-origin:right; }
  .status-badge { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:500; }
  .status-badge.idle { background:rgba(159,179,200,0.15); color:var(--text-2); }
  .status-badge.reading { background:rgba(95,176,255,0.15); color:var(--accent); }
  .status-badge.echoing { background:rgba(74,222,128,0.15); color:var(--green); }
  .status-badge .dot { width:6px; height:6px; border-radius:50%; background:currentColor; animation:pulse 1.4s ease infinite; }
  @keyframes pulse { 0%,100%{opacity:0.4;} 50%{opacity:1;} }
  .footer-note { text-align:center; padding:32px 0 0; font-size:12px; color:var(--text-3); }
  @media(max-width:640px) { .controls{flex-direction:column;gap:12px;} .control-group{flex-wrap:wrap;justify-content:center;} .sentence-card{padding:14px 16px 14px 48px;} .sentence-en{font-size:15px;} }
</style>
</head>
<body>
<header>
  <a class="back-link" href="../index.html"><span style="font-size:18px;">←</span><span>返回首页</span></a>
  <div class="logo-text">Seeklume</div>
  <div class="header-right">
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题"><span class="icon-moon">🌙</span><span class="icon-sun">☀️</span></button>
  </div>
</header>
<main>
  <div class="lesson-info">
    <div class="eyebrow">Welcome Unit · Reading and Thinking</div>
    <h1>Han Jing's World</h1>
    <p class="subtitle">新人教版高中英语必修一 · 跟读训练</p>
  </div>
  <div class="controls">
    <div class="control-group">
      <span class="control-label">语速</span>
      <button class="speed-btn" data-speed="0.8" onclick="setSpeed(0.8,this)">0.8×</button>
      <button class="speed-btn active" data-speed="0.9" onclick="setSpeed(0.9,this)">0.9×</button>
      <button class="speed-btn" data-speed="1.0" onclick="setSpeed(1.0,this)">1.0×</button>
    </div>
    <div class="control-group">
      <span class="control-label">跟读间隔</span>
      <button class="gap-btn" data-gap="1.0" onclick="setGap(1.0,this)">短</button>
      <button class="gap-btn active" data-gap="1.5" onclick="setGap(1.5,this)">中</button>
      <button class="gap-btn" data-gap="2.0" onclick="setGap(2.0,this)">长</button>
    </div>
    <button class="btn-primary" id="startBtn" onclick="toggleReading()">开始跟读</button>
    <button class="btn-secondary" onclick="toggleTranslation()" id="transBtn">显示中文</button>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div style="text-align:center;margin-bottom:24px;">
    <span class="status-badge idle" id="statusBadge"><span class="dot"></span><span id="statusText">准备就绪</span></span>
  </div>
  <div id="textContent"></div>
  <div class="footer-note">点击任意句子可单独朗读 · 建议佩戴耳机使用</div>
</main>
<div class="countdown-overlay" id="countdownOverlay">
  <div class="countdown-label">请跟读</div>
  <div class="countdown-number" id="countdownNum">3</div>
  <div class="countdown-hint" id="countdownHint">模仿语音语调，大声朗读</div>
  <div class="countdown-bar"><div class="countdown-bar-fill" id="countdownBarFill"></div></div>
</div>
<script>
var TEXT_DATA=[
{time:"7:00 a.m.",sentences:[
{en:"So this is it — senior high school at last!",zh:"就这样了——终于到高中了！"},
{en:"I'm not outgoing so I'm a little anxious right now.",zh:"我不太外向，所以现在有点紧张。"},
{en:"I want to make a good first impression.",zh:"我想留下一个好的第一印象。"},
{en:"Will I make any friends?",zh:"我会交到朋友吗？"},
{en:"What if no one talks to me?",zh:"要是没人跟我说话怎么办？"}
]},
{time:"12:30 p.m.",sentences:[
{en:"I just had my first maths class at senior high school!",zh:"我刚上完高中的第一节数学课！"},
{en:"The class was difficult, but the teacher was kind and friendly.",zh:"课很难，但老师很和蔼友好。"},
{en:"He even told us a funny story, and everyone laughed so much!",zh:"他甚至讲了一个有趣的故事，大家都笑得不行！"},
{en:"I found most of my classmates and teachers friendly and helpful.",zh:"我发现大多数同学和老师都很友好、很乐于助人。"}
]},
{time:"5:32 p.m.",sentences:[
{en:"This afternoon, we had our chemistry class in the science lab.",zh:"今天下午，我们在科学实验室上了化学课。"},
{en:"The lab is new and the lesson was great, but the guy next to me tried to talk to me the whole time.",zh:"实验室是新的，课也很棒，但旁边的男生一直想跟我说话。"},
{en:"I couldn't concentrate on the experiment.",zh:"我无法集中精力做实验。"},
{en:"I really wanted to tell him to please be quiet and leave me alone!",zh:"我真想告诉他请安静，别烦我！"}
]},
{time:"10:29 p.m.",sentences:[
{en:"What a day!",zh:"这一天啊！"},
{en:"This morning, I was worried that no one would talk to me.",zh:"今天早上，我还担心没人会跟我说话。"},
{en:"But that was just a wrong guess.",zh:"但那只是一个错误的猜测。"},
{en:"Most of my classmates and teachers are helpful and I like them.",zh:"大多数同学和老师都很乐于助人，我很喜欢他们。"},
{en:"I feel much more confident now.",zh:"我现在感觉自信多了。"},
{en:"I think I'll make new friends here.",zh:"我想我会在这里交到新朋友的。"},
{en:"I'm sure I'll be doing fine.",zh:"我相信我会一切顺利的。"}
]}
];
var allSentences=[],contentEl=document.getElementById('textContent');
TEXT_DATA.forEach(function(section){
  var sec=document.createElement('div');sec.className='text-section';
  var marker=document.createElement('div');marker.className='time-marker';marker.textContent=section.time;
  sec.appendChild(marker);
  section.sentences.forEach(function(s){
    var idx=allSentences.length;allSentences.push(s);
    var card=document.createElement('div');card.className='sentence-card';card.dataset.index=idx;
    card.innerHTML='<div class="check-mark">✓</div><div class="sentence-num">'+(idx+1)+'</div><p class="sentence-en">'+s.en+'</p><p class="sentence-zh">'+s.zh+'</p>';
    card.onclick=function(){speakSingle(idx);};
    sec.appendChild(card);
  });
  contentEl.appendChild(sec);
});
var speed=0.9,gapMultiplier=1.5,isReading=false,currentIdx=-1,utterance=null;
function setSpeed(s,btn){speed=s;document.querySelectorAll('.speed-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');}
function setGap(g,btn){gapMultiplier=g;document.querySelectorAll('.gap-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');}
function toggleTheme(){var cur=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',cur==='light'?'':'light');try{localStorage.setItem('theme',cur==='light'?'dark':'light');}catch(e){}}
try{var saved=localStorage.getItem('theme');if(saved==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}
function toggleTranslation(){document.body.classList.toggle('show-translation');var btn=document.getElementById('transBtn');var showing=document.body.classList.contains('show-translation');btn.textContent=showing?'隐藏中文':'显示中文';}
function updateStatus(state,text){var badge=document.getElementById('statusBadge');var txt=document.getElementById('statusText');badge.className='status-badge '+state;txt.textContent=text;}
function updateProgress(){var pct=((currentIdx+1)/allSentences.length)*100;document.getElementById('progressFill').style.width=pct+'%';}
function highlightCard(idx){document.querySelectorAll('.sentence-card').forEach(function(c){c.classList.remove('active');if(parseInt(c.dataset.index)<idx)c.classList.add('read');});if(idx>=0&&idx<allSentences.length){var card=document.querySelector('.sentence-card[data-index="'+idx+'"]');if(card){card.classList.add('active');card.classList.remove('read');card.scrollIntoView({behavior:'smooth',block:'center'});}}}
function calcEchoTime(text){var words=text.split(/\s+/).length;return Math.max(2,(words*0.4+1.5)*gapMultiplier);}
function showCountdown(seconds){var overlay=document.getElementById('countdownOverlay');var num=document.getElementById('countdownNum');var bar=document.getElementById('countdownBarFill');overlay.classList.add('show');var remaining=Math.ceil(seconds);num.textContent=remaining;bar.style.transition='none';bar.style.transform='scaleX(1)';bar.offsetHeight;bar.style.transition='transform '+seconds+'s linear';bar.style.transform='scaleX(0)';}
function hideCountdown(){document.getElementById('countdownOverlay').classList.remove('show');}
function speakSentence(idx){
  if(idx>=allSentences.length){finishReading();return;}
  currentIdx=idx;highlightCard(idx);updateProgress();
  updateStatus('reading','朗读中…（第 '+(idx+1)+'/'+allSentences.length+' 句）');
  var text=allSentences[idx].en.replace(/—/g,', ').replace(/–/g,', ');
  if(utterance){window.speechSynthesis.cancel();}
  utterance=new SpeechSynthesisUtterance(text);
  utterance.lang='en-US';utterance.rate=speed;
  utterance.onend=function(){
    if(!isReading)return;
    var echoTime=calcEchoTime(allSentences[idx].en);
    updateStatus('echoing','请跟读…（'+Math.ceil(echoTime)+' 秒）');
    showCountdown(echoTime);
    setTimeout(function(){
      if(!isReading)return;
      hideCountdown();
      var card=document.querySelector('.sentence-card[data-index="'+idx+'"]');
      if(card){card.classList.add('read');card.classList.remove('active');}
      speakSentence(idx+1);
    },echoTime*1000);
  };
  utterance.onerror=function(){if(!isReading)return;setTimeout(function(){speakSentence(idx+1);},500);};
  window.speechSynthesis.speak(utterance);
}
function toggleReading(){
  if(isReading){
    isReading=false;window.speechSynthesis.cancel();hideCountdown();highlightCard(-1);
    updateStatus('idle','已暂停');
    document.getElementById('startBtn').textContent='继续跟读';
  }else{
    isReading=true;document.getElementById('startBtn').textContent='停止';
    var startIdx=currentIdx>=0?currentIdx+1:0;
    if(startIdx>=allSentences.length){
      startIdx=0;
      document.querySelectorAll('.sentence-card').forEach(function(c){c.classList.remove('read','active');});
      currentIdx=-1;
    }
    speakSentence(startIdx);
  }
}
function speakSingle(idx){
  if(isReading)return;
  var text=allSentences[idx].en.replace(/—/g,', ').replace(/–/g,', ');
  if(utterance){window.speechSynthesis.cancel();}
  document.querySelectorAll('.sentence-card').forEach(function(c){c.classList.remove('active');});
  var card=document.querySelector('.sentence-card[data-index="'+idx+'"]');
  if(card)card.classList.add('active');
  utterance=new SpeechSynthesisUtterance(text);
  utterance.lang='en-US';utterance.rate=speed;
  utterance.onend=function(){if(card)card.classList.remove('active');};
  window.speechSynthesis.speak(utterance);
}
function finishReading(){
  isReading=false;hideCountdown();
  updateStatus('idle','跟读完成！');
  document.getElementById('startBtn').textContent='重新跟读';
  currentIdx=-1;
}
window.toggleReading=toggleReading;window.toggleTheme=toggleTheme;window.toggleTranslation=toggleTranslation;window.setSpeed=setSpeed;window.setGap=setGap;window.speakSingle=speakSingle;
</script>
</body>
</html>
