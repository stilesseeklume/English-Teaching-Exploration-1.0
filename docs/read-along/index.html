<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seeklume · Read Along</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Caveat:wght@400;600&display=swap');

  :root {
    --bg:#f5f5f7; --surface:#ffffff; --surface-2:#fafafa; --surface-3:#f0f0f2;
    --border:#e5e5ea; --text:#1d1d1f; --text-2:#6e6e73; --text-3:#aeaeb2;
    --accent:#0071e3; --accent-bg:#f0f7ff; --green:#34c759; --green-bg:#e8f8ed;
    --radius:10px;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.04);
    --shadow-lg:0 4px 16px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04);
    --font-display:'Instrument Serif',Georgia,serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;
    --font-hand:'Caveat',cursive;
    --passage-size:17px;
  }
  [data-theme="dark"] {
    --bg:#1c1c1e; --surface:#2c2c2e; --surface-2:#3a3a3c; --surface-3:#48484a;
    --border:#38383a; --text:#f5f5f7; --text-2:#98989d; --text-3:#636366;
    --accent:#409cff; --accent-bg:rgba(64,156,255,0.15);
    --green:#30d158; --green-bg:rgba(48,209,88,0.15);
    --shadow:0 1px 3px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.06);
    --shadow-lg:0 4px 16px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;font-family:var(--font-body);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;}

  header{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);}
  .back-link{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--accent);font-size:14px;font-weight:500;}
  .back-link:hover{opacity:0.7;}
  .logo-text{font-family:var(--font-display);font-size:18px;color:var(--text);}
  .header-right{display:flex;align-items:center;gap:8px;}
  .theme-toggle{background:var(--surface-2);border:1px solid var(--border);cursor:pointer;font-size:14px;padding:4px 10px;border-radius:6px;color:var(--text-2);}
  .theme-toggle:hover{background:var(--surface-3);}
  .theme-toggle .icon-sun{display:none;}
  [data-theme="dark"] .theme-toggle .icon-sun{display:inline;}
  [data-theme="dark"] .theme-toggle .icon-moon{display:none;}

  main{max-width:780px;margin:0 auto;padding:32px 24px 100px;}
  .lesson-header{text-align:center;margin-bottom:28px;padding-bottom:16px;border-bottom:2px solid var(--accent);}
  .lesson-header .unit-tag{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:0.15em;margin-bottom:10px;text-transform:uppercase;}
  .lesson-header h1{font-family:var(--font-display);font-size:34px;font-weight:400;margin:0 0 6px;color:var(--text);}
  .lesson-header .sub{font-size:13px;color:var(--text-3);}

  /* ===== 语音选择器 ===== */
  .voice-panel{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  .voice-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .voice-label{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:0.08em;min-width:52px;}
  .voice-btn{padding:6px 14px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);font:inherit;font-size:13px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;}
  .voice-btn .flag{font-size:16px;}
  .voice-btn.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600;box-shadow:0 0 0 1px var(--accent);}
  .voice-btn:hover{border-color:var(--text-3);}
  .voice-btn.active:hover{border-color:var(--accent);}

  .controls-bar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .ctrl-group{display:flex;align-items:center;gap:6px;}
  .ctrl-label{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;}
  .pill-btn{padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font:inherit;font-size:12px;cursor:pointer;transition:all .15s;}
  .pill-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .pill-btn:hover{border-color:var(--text-3);}
  .pill-btn.active:hover{border-color:var(--accent);}
  .font-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .font-btn:hover{border-color:var(--text-3);color:var(--text);}
  .start-btn{padding:8px 28px;border-radius:6px;border:none;background:var(--accent);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s;}
  .start-btn:hover{opacity:0.85;}
  .ghost-btn{padding:7px 16px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font:inherit;font-size:13px;cursor:pointer;}
  .ghost-btn:hover{background:var(--surface-2);color:var(--text);}

  .progress-bar{height:3px;background:var(--surface-3);border-radius:999px;overflow:hidden;margin-bottom:12px;}
  .progress-fill{height:100%;background:var(--accent);width:0%;transition:width .4s ease;}
  .status-row{text-align:center;margin-bottom:24px;}
  .status-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:500;}
  .status-badge.idle{background:var(--surface-3);color:var(--text-2);}
  .status-badge.reading{background:var(--accent-bg);color:var(--accent);}
  .status-badge.echoing{background:var(--green-bg);color:var(--green);}
  .status-badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease infinite;}
  @keyframes pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}

  /* ===== 课本风格课文 ===== */
  .textbook{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:40px 44px 40px 40px;
    position:relative;
  }
  /* 课本左侧装饰线 */
  .textbook::before{
    content:'';
    position:absolute;
    left:0;top:40px;bottom:40px;
    width:3px;
    background:var(--accent);
    border-radius:0 2px 2px 0;
    opacity:0.6;
  }
  .textbook-title{
    font-family:var(--font-display);
    font-size:15px;
    font-weight:600;
    color:var(--text-2);
    text-transform:uppercase;
    letter-spacing:0.12em;
    margin-bottom:4px;
  }
  .textbook-subtitle{
    font-family:var(--font-display);
    font-size:28px;
    font-weight:400;
    color:var(--text);
    margin:0 0 20px;
    line-height:1.2;
  }
  .text-block{margin-bottom:26px;position:relative;}
  .text-block:last-child{margin-bottom:0;}
  /* 时间戳 - 课本风格 */
  .time-stamp{
    display:inline-block;
    font-family:var(--font-hand);
    font-size:22px;
    font-weight:600;
    color:var(--accent);
    margin-bottom:6px;
    padding:0 0 2px;
    border-bottom:1.5px solid var(--accent);
    opacity:0.85;
  }
  .passage-text{margin:0;font-size:var(--passage-size);line-height:2;color:var(--text);transition:font-size .2s;}
  .sent{position:relative;transition:background .2s,color .2s;border-radius:3px;padding:1px 2px;cursor:pointer;}
  .sent:hover{background:var(--surface-3);}
  .sent.active{background:var(--accent-bg);color:var(--accent);font-weight:500;box-shadow:0 0 0 1.5px var(--accent);}
  .sent.read{color:var(--text-3);}

  .trans-toggle{display:block;width:100%;padding:10px;margin-top:20px;border:none;background:var(--surface-2);color:var(--text-2);font:inherit;font-size:13px;cursor:pointer;border-radius:6px;}
  .trans-toggle:hover{background:var(--surface-3);color:var(--text);}
  .translation{display:none;margin-top:16px;padding:20px 24px;background:var(--surface-2);border-radius:6px;font-size:14px;line-height:1.8;color:var(--text-2);}
  .show-trans .translation{display:block;animation:fadeIn .3s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .trans-block{margin-bottom:12px;}
  .trans-block:last-child{margin-bottom:0;}
  .trans-time{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:2px;}

  .countdown{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);z-index:200;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 32px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);opacity:0;transition:transform .3s cubic-bezier(.16,1,.3,1),opacity .3s ease;pointer-events:none;}
  .countdown.show{transform:translateX(-50%) translateY(0);opacity:1;}
  .countdown-label{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);font-weight:600;}
  .countdown-num{font-family:var(--font-display);font-size:36px;color:var(--text);line-height:1;}
  .countdown-hint{font-size:12px;color:var(--text-2);}
  .countdown-bar{width:100px;height:3px;background:var(--surface-3);border-radius:999px;overflow:hidden;}
  .countdown-bar-fill{height:100%;background:var(--accent);width:100%;transform-origin:right;}

  .footer-note{text-align:center;padding:24px 0 0;font-size:12px;color:var(--text-3);}
  @media(max-width:640px){.textbook{padding:24px 20px;}.controls-bar{flex-direction:column;gap:8px;}.voice-panel{padding:12px 16px;}}
</style>
</head>
<body>
<header>
  <a class="back-link" href="../index.html"><span>←</span><span>Back</span></a>
  <div class="logo-text">Seeklume</div>
  <div class="header-right">
    <button class="theme-toggle" onclick="toggleTheme()"><span class="icon-moon">🌙</span><span class="icon-sun">☀️</span></button>
  </div>
</header>
<main>
  <div class="lesson-header">
    <div class="unit-tag">Welcome Unit · Reading and Thinking</div>
    <h1>First Impressions</h1>
    <div class="sub">Han Jing's World · New Senior High English · Book 1</div>
  </div>

  <!-- 语音选择 -->
  <div class="voice-panel">
    <div class="voice-row">
      <span class="voice-label">Accent</span>
      <button class="voice-btn active" data-accent="uk" onclick="setAccent('uk',this)"><span class="flag">🇬🇧</span>British</button>
      <button class="voice-btn" data-accent="us" onclick="setAccent('us',this)"><span class="flag">🇺🇸</span>American</button>
      <button class="voice-btn" data-accent="au" onclick="setAccent('au',this)"><span class="flag">🇦🇺</span>Australian</button>
    </div>
    <div class="voice-row">
      <span class="voice-label">Voice</span>
      <button class="voice-btn active" data-gender="f" onclick="setGender('f',this)">♀ Female</button>
      <button class="voice-btn" data-gender="m" onclick="setGender('m',this)">♂ Male</button>
    </div>
  </div>

  <div class="controls-bar">
    <div class="ctrl-group">
      <span class="ctrl-label">Speed</span>
      <button class="pill-btn" data-speed="0.8" onclick="setSpeed(0.8,this)">0.8×</button>
      <button class="pill-btn active" data-speed="1.0" onclick="setSpeed(1.0,this)">1.0×</button>
      <button class="pill-btn" data-speed="1.2" onclick="setSpeed(1.2,this)">1.2×</button>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">Gap</span>
      <button class="pill-btn" data-gap="1.0" onclick="setGap(1.0,this)">Short</button>
      <button class="pill-btn active" data-gap="1.5" onclick="setGap(1.5,this)">Mid</button>
      <button class="pill-btn" data-gap="2.0" onclick="setGap(2.0,this)">Long</button>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">A</span>
      <button class="font-btn" onclick="decFont()">−</button>
      <button class="font-btn" onclick="incFont()">+</button>
    </div>
    <button class="start-btn" id="startBtn" onclick="toggleReading()">Start Reading</button>
    <button class="ghost-btn" onclick="toggleTrans()" id="transBtn">Show Translation</button>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="status-row">
    <span class="status-badge idle" id="statusBadge"><span class="dot"></span><span id="statusText">Ready</span></span>
  </div>

  <!-- 课本风格课文 -->
  <div class="textbook">
    <div class="textbook-title">Reading and Thinking</div>
    <h2 class="textbook-subtitle">Han Jing's World</h2>
    <div id="passage"></div>
  </div>

  <button class="trans-toggle" onclick="toggleTrans()" id="transToggle" style="display:none;">Show Translation</button>
  <div class="translation" id="translation"></div>
  <div class="footer-note">Click any sentence to start reading from there · Pre-generated audio</div>
</main>
<audio id="audioPlayer" preload="auto"></audio>
<div class="countdown" id="countdown">
  <div class="countdown-label">Echo</div>
  <div class="countdown-num" id="countdownNum">3</div>
  <div class="countdown-hint">Read aloud, imitate the tone</div>
  <div class="countdown-bar"><div class="countdown-bar-fill" id="countdownBarFill"></div></div>
</div>
<script>
var PASSAGE=[
{time:"7:00 a.m.",sentences:[
{en:"So this is it \u2014 senior high school at last!",zh:"\u5c31\u8fd9\u6837\u4e86\u2014\u2014\u7ec8\u4e8e\u5230\u9ad8\u4e2d\u4e86\uff01"},
{en:"I'm not outgoing so I'm a little anxious right now.",zh:"\u6211\u4e0d\u592a\u5916\u5411\uff0c\u6240\u4ee5\u73b0\u5728\u6709\u70b9\u7d27\u5f20\u3002"},
{en:"I want to make a good first impression.",zh:"\u6211\u60f3\u7559\u4e0b\u4e00\u4e2a\u597d\u7684\u7b2c\u4e00\u5370\u8c61\u3002"},
{en:"Will I make any friends?",zh:"\u6211\u4f1a\u4ea4\u5230\u670b\u53cb\u5417\uff1f"},
{en:"What if no one talks to me?",zh:"\u8981\u662f\u6ca1\u4eba\u8ddf\u6211\u8bf4\u8bdd\u600e\u4e48\u529e\uff1f"}
]},
{time:"12:30 p.m.",sentences:[
{en:"I just had my first maths class at senior high school!",zh:"\u6211\u521a\u4e0a\u5b8c\u9ad8\u4e2d\u7684\u7b2c\u4e00\u8282\u6570\u5b66\u8bfe\uff01"},
{en:"The class was difficult, but the teacher was kind and friendly.",zh:"\u8bfe\u5f88\u96be\uff0c\u4f46\u8001\u5e08\u5f88\u548c\u853d\u53cb\u597d\u3002"},
{en:"He even told us a funny story, and everyone laughed so much!",zh:"\u4ed6\u751a\u81f3\u8bb2\u4e86\u4e00\u4e2a\u6709\u8da3\u7684\u6545\u4e8b\uff0c\u5927\u5bb6\u90fd\u7b11\u5f97\u4e0d\u884c\uff01"},
{en:"I found most of my classmates and teachers friendly and helpful.",zh:"\u6211\u53d1\u73b0\u5927\u591a\u6570\u540c\u5b66\u548c\u8001\u5e08\u90fd\u5f88\u53cb\u597d\u3001\u5f88\u4e50\u4e8e\u52a9\u4eba\u3002"}
]},
{time:"5:32 p.m.",sentences:[
{en:"This afternoon, we had our chemistry class in the science lab.",zh:"\u4eca\u5929\u4e0b\u5348\uff0c\u6211\u4eec\u5728\u79d1\u5b66\u5b9e\u9a8c\u5ba4\u4e0a\u4e86\u5316\u5b66\u8bfe\u3002"},
{en:"The lab is new and the lesson was great, but the guy next to me tried to talk to me the whole time.",zh:"\u5b9e\u9a8c\u5ba4\u662f\u65b0\u7684\uff0c\u8bfe\u4e5f\u5f88\u68d2\uff0c\u4f46\u65c1\u8fb9\u7684\u7537\u751f\u4e00\u76f4\u60f3\u8ddf\u6211\u8bf4\u8bdd\u3002"},
{en:"I couldn't concentrate on the experiment.",zh:"\u6211\u65e0\u6cd5\u96c6\u4e2d\u7cbe\u529b\u505a\u5b9e\u9a8c\u3002"},
{en:"I really wanted to tell him to please be quiet and leave me alone!",zh:"\u6211\u771f\u60f3\u544a\u8bc9\u4ed6\u8bf7\u5b89\u9759\uff0c\u522b\u70e6\u6211\uff01"}
]},
{time:"10:29 p.m.",sentences:[
{en:"What a day!",zh:"\u8fd9\u4e00\u5929\u554a\uff01"},
{en:"This morning, I was worried that no one would talk to me.",zh:"\u4eca\u5929\u65e9\u6668\uff0c\u6211\u8fd8\u62c5\u5fc3\u6ca1\u4eba\u4f1a\u8ddf\u6211\u8bf4\u8bdd\u3002"},
{en:"But I was wrong.",zh:"\u4f46\u6211\u9519\u4e86\u3002"},
{en:"I didn't feel awkward or frightened at all.",zh:"\u6211\u4e00\u70b9\u513f\u4e5f\u4e0d\u89c9\u5f97\u5c34\u5c2c\u6216\u5bb3\u6015\u3002"},
{en:"I miss my friends from junior high school, but I believe I will make new friends here, and there's a lot to explore at senior high.",zh:"\u6211\u60f3\u5ff5\u521d\u4e2d\u7684\u670b\u53cb\u4eec\uff0c\u4f46\u6211\u76f8\u4fe1\u6211\u4f1a\u5728\u8fd9\u91cc\u7ed3\u4ea4\u65b0\u670b\u53cb\uff0c\u800c\u4e14\u9ad8\u4e2d\u6709\u5f88\u591a\u4e8b\u7269\u7b49\u7740\u6211\u53bb\u63a2\u7d22\u3002"},
{en:"I feel much more confident than I felt this morning.",zh:"\u6211\u611f\u89c9\u6bd4\u4eca\u5929\u65e9\u4e0a\u81ea\u4fe1\u591a\u4e86\u3002"},
{en:"I think that tomorrow will be a great day!",zh:"\u6211\u76f8\u4fe1\uff0c\u660e\u5929\u5c06\u662f\u975e\u5e38\u4e0d\u9519\u7684\u4e00\u5929\uff01"}
]}
];

var allSent=[];
var passageEl=document.getElementById('passage');
var transEl=document.getElementById('translation');
PASSAGE.forEach(function(blk){
  var div=document.createElement('div');div.className='text-block';
  var ts=document.createElement('span');ts.className='time-stamp';ts.textContent=blk.time;
  div.appendChild(ts);
  var p=document.createElement('p');p.className='passage-text';
  blk.sentences.forEach(function(s,i){
    var idx=allSent.length;allSent.push(s);
    var span=document.createElement('span');span.className='sent';span.dataset.index=idx;
    span.textContent=s.en;
    span.onclick=function(){onSentenceClick(idx);};
    p.appendChild(span);
    if(i<blk.sentences.length-1)p.appendChild(document.createTextNode(' '));
  });
  div.appendChild(p);passageEl.appendChild(div);
});
PASSAGE.forEach(function(blk){
  var tb=document.createElement('div');tb.className='trans-block';
  var tt=document.createElement('div');tt.className='trans-time';tt.textContent=blk.time;
  tb.appendChild(tt);
  var tp=document.createElement('p');tp.style.margin='0';tp.textContent=blk.sentences.map(function(s){return s.zh;}).join(' ');
  tb.appendChild(tp);transEl.appendChild(tb);
});

// 语音选择
var accent='uk', gender='f';
var voiceMap={
  'uk_f':'en-GB-SoniaNeural', 'uk_m':'en-GB-RyanNeural',
  'us_f':'en-US-AriaNeural',  'us_m':'en-US-ChristopherNeural',
  'au_f':'en-AU-NatashaNeural','au_m':'en-AU-WilliamMultilingualNeural'
};
var audioDirMap={
  'uk_f':'uk_f','uk_m':'uk_m','us_f':'us_f','us_m':'us_m','au_f':'au_f','au_m':'au_m'
};

function getAudioDir(){return audioDirMap[accent+'_'+gender];}
function getAudioFile(idx){return 'audio/'+getAudioDir()+'/sent_'+String(idx).padStart(2,'0')+'.mp3';}

function setAccent(a,btn){
  accent=a;
  document.querySelectorAll('[data-accent]').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  // 如果正在跟读，切换口音后从当前句重新播放
  if(isReading&&curIdx>=0){
    audio.pause();
    speak(curIdx);
  }
}
function setGender(g,btn){
  gender=g;
  document.querySelectorAll('[data-gender]').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  if(isReading&&curIdx>=0){
    audio.pause();
    speak(curIdx);
  }
}

var speed=1.0,gapMul=1.5,isReading=false,curIdx=-1;
var audio=document.getElementById('audioPlayer');
audio.playbackRate=1.0;

function setSpeed(s,b){speed=s;audio.playbackRate=s;document.querySelectorAll('.pill-btn[data-speed]').forEach(function(x){x.classList.remove('active');});b.classList.add('active');}
function setGap(g,b){gapMul=g;document.querySelectorAll('.pill-btn[data-gap]').forEach(function(x){x.classList.remove('active');});b.classList.add('active');}
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme');var n=c==='dark'?'':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('theme',n==='dark'?'dark':'light');}catch(e){}}
try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}
function toggleTrans(){document.body.classList.toggle('show-trans');var b=document.getElementById('transBtn');var t=document.getElementById('transToggle');var show=document.body.classList.contains('show-trans');b.textContent=show?'Hide Translation':'Show Translation';if(t)t.textContent=show?'Hide Translation':'Show Translation';}
function updateStatus(s,t){var b=document.getElementById('statusBadge');var x=document.getElementById('statusText');b.className='status-badge '+s;x.textContent=t;}
function updateProgress(){var pct=((curIdx+1)/allSent.length)*100;document.getElementById('progressFill').style.width=pct+'%';}
function highlightSent(idx){document.querySelectorAll('.sent').forEach(function(s){s.classList.remove('active');if(parseInt(s.dataset.index)<idx)s.classList.add('read');else s.classList.remove('read');});if(idx>=0&&idx<allSent.length){var el=document.querySelector('.sent[data-index="'+idx+'"]');if(el){el.classList.add('active');el.classList.remove('read');scrollSentToCenter(el);}}}
function scrollSentToCenter(el){if(!el)return;var rect=el.getBoundingClientRect();var offset=rect.top+rect.height/2-window.innerHeight/2;window.scrollTo({top:window.scrollY+offset,behavior:'smooth'});}

var _fontSize=17;
function applyFont(){document.documentElement.style.setProperty('--passage-size',_fontSize+'px');try{localStorage.setItem('readFont',_fontSize);}catch(e){}}
function incFont(){_fontSize=Math.min(36,_fontSize+1);applyFont();}
function decFont(){_fontSize=Math.max(12,_fontSize-1);applyFont();}
try{var sf=localStorage.getItem('readFont');if(sf){_fontSize=parseInt(sf)||17;applyFont();}}catch(e){}

function calcEcho(text){var w=text.split(/\s+/).length;return Math.max(2.5,(w*0.45+1.5)*gapMul);}
function showCountdown(sec){var o=document.getElementById('countdown');var n=document.getElementById('countdownNum');var b=document.getElementById('countdownBarFill');o.classList.add('show');n.textContent=Math.ceil(sec);b.style.transition='none';b.style.transform='scaleX(1)';b.offsetHeight;b.style.transition='transform '+sec+'s linear';b.style.transform='scaleX(0)';}
function hideCountdown(){document.getElementById('countdown').classList.remove('show');}

function speak(idx){
  if(idx>=allSent.length){finish();return;}
  curIdx=idx;highlightSent(idx);updateProgress();
  updateStatus('reading','Playing... ('+(idx+1)+'/'+allSent.length+')');
  audio.src=getAudioFile(idx);
  audio.playbackRate=speed;
  audio.play().catch(function(e){console.error('Audio play failed:',e);if(isReading)setTimeout(function(){speak(idx+1);},500);});
}
audio.onended=function(){
  if(!isReading)return;
  var echoTime=calcEcho(allSent[curIdx].en);
  updateStatus('echoing','Echo... ('+Math.ceil(echoTime)+'s)');
  showCountdown(echoTime);
  setTimeout(function(){
    if(!isReading)return;
    hideCountdown();
    var el=document.querySelector('.sent[data-index="'+curIdx+'"]');
    if(el){el.classList.add('read');el.classList.remove('active');}
    speak(curIdx+1);
  },echoTime*1000);
};

function toggleReading(){
  if(isReading){
    isReading=false;audio.pause();hideCountdown();highlightSent(-1);
    updateStatus('idle','Paused');
    document.getElementById('startBtn').textContent='Resume';
  }else{
    isReading=true;document.getElementById('startBtn').textContent='Stop';
    var si=curIdx>=0?curIdx:0;
    if(si>=allSent.length){si=0;document.querySelectorAll('.sent').forEach(function(s){s.classList.remove('read','active');});curIdx=-1;}
    speak(si);
  }
}

function onSentenceClick(idx){
  if(isReading){
    document.querySelectorAll('.sent').forEach(function(s){if(parseInt(s.dataset.index)>=idx)s.classList.remove('read','active');});
    curIdx=idx-1;
    speak(idx);
    return;
  }
  document.querySelectorAll('.sent').forEach(function(s){if(parseInt(s.dataset.index)>=idx)s.classList.remove('read','active');});
  curIdx=idx-1;
  isReading=true;
  document.getElementById('startBtn').textContent='Stop';
  speak(idx);
}

function finish(){
  isReading=false;hideCountdown();
  updateStatus('idle','Complete!');
  document.getElementById('startBtn').textContent='Restart';
  curIdx=-1;
}

window.toggleReading=toggleReading;window.toggleTheme=toggleTheme;window.toggleTrans=toggleTrans;window.setSpeed=setSpeed;window.setGap=setGap;window.speakSingle=function(){};window.onSentenceClick=onSentenceClick;window.incFont=incFont;window.decFont=decFont;window.setAccent=setAccent;window.setGender=setGender;
</script>
</body>
</html>
