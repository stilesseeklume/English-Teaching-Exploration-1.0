<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语教学系统</title>
<style>
  :root {
    --bg: #f5f3ef;
    --text: #2c2416;
    --text-2: #6b5e4a;
    --accent: #8b6914;
    --accent-bg: #fdf6e8;
    --border: #e5e0d9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .container { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
  header {
    text-align: center;
    padding: 64px 0 48px;
  }
  header h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text);
    margin-bottom: 8px;
  }
  header p {
    color: var(--text-2);
    font-size: 1rem;
  }
  .modules {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .module-card {
    display: block;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px 28px;
    text-decoration: none;
    color: var(--text);
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .module-card:hover {
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border-color: var(--accent);
  }
  .module-card h2 {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .module-card .desc {
    font-size: 0.9rem;
    color: var(--text-2);
    line-height: 1.5;
  }
  .module-card .tag {
    display: inline-block;
    margin-top: 10px;
    padding: 2px 10px;
    font-size: 0.8rem;
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 4px;
  }
  .coming-soon {
    opacity: 0.5;
    pointer-events: none;
  }
  footer {
    text-align: center;
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--text-2);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>英语教学系统</h1>
    <p>辅助教师进行英语教学的体系化工具</p>
  </header>

  <div class="modules">
    <a href="/grammar-fill/" class="module-card">
      <h2>语法填空 · 课堂助手</h2>
      <p class="desc">20 套真题按套卷/考点练习，空格点击弹解析，错题本，迁移训练</p>
      <span class="tag">已上线</span>
    </a>

    <div class="module-card coming-soon">
      <h2>完形填空 · 语义关联训练</h2>
      <p class="desc">九招解题法，语义场分析，前后线索追踪</p>
      <span class="tag">敬请期待</span>
    </div>

    <div class="module-card coming-soon">
      <h2>阅读理解 · 题型导问</h2>
      <p class="desc">七项能力分类，三层导问法，文本结构解析</p>
      <span class="tag">敬请期待</span>
    </div>

    <div class="module-card coming-soon">
      <h2>七选五 · 逻辑衔接</h2>
      <p class="desc">八类逻辑关系，代词指代追踪，四步解题法</p>
      <span class="tag">敬请期待</span>
    </div>

    <div class="module-card coming-soon">
      <h2>写作训练</h2>
      <p class="desc">应用文双支架 · 读后续写双轨提纲</p>
      <span class="tag">敬请期待</span>
    </div>
  </div>

  <footer>
    <a href="https://github.com/stilesseeklume/English-Teaching-Exploration-1.0" style="color:inherit">开源代码</a>
  </footer>
</div>
</body>
</html>
