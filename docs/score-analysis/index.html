<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seeklume · 成绩分析已转为本地隐私工具</title>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #fff;
    --border: #e5e5ea;
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --accent: #0071e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: min(560px, 100%);
    padding: 34px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    text-align: center;
    box-shadow: 0 18px 60px rgba(0,0,0,.08);
  }
  .eyebrow {
    margin-bottom: 12px;
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 12px;
    font-size: clamp(24px, 5vw, 34px);
    line-height: 1.2;
    letter-spacing: -.5px;
  }
  p {
    margin: 0 auto 22px;
    color: var(--text-2);
    font-size: 15px;
    line-height: 1.8;
  }
  .actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 0 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  a.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Privacy First</div>
    <h1>成绩分析已转为本地隐私工具</h1>
    <p>学生成绩、班级数据和个人画像不适合放在公开网站。这个模块不再通过 GitHub Pages 发布；公开站当前只保留语法填空讲评。</p>
    <div class="actions">
      <a class="primary" href="../grammar-fill/">进入语法填空</a>
      <a href="../">返回首页</a>
    </div>
  </main>
</body>
</html>
